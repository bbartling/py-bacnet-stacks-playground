# TimescaleDB for VOLTTRON SQLHistorian on the *central* Ubuntu host.
# Run from this directory: docker compose -f docker-compose.timescale.yml up -d
#
# Port 5432 is bound to 127.0.0.1 only so only local VOLTTRON can reach the DB
# (adjust if your historian runs elsewhere — prefer VPN / private network, not public 0.0.0.0).

services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: volttron_timescale
    restart: unless-stopped
    environment:
      POSTGRES_USER: volttron
      # Override in .env for anything beyond a disposable lab.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-volttron_change_me_in_prod}
      POSTGRES_DB: volttron
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - volttron_ts_data:/var/lib/postgresql/data

volumes:
  volttron_ts_data:
