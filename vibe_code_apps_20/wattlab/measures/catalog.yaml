ecms:
  - &defaults
    ecm_id: ECM-AHU-SCHED-ALIGN
    display_name: Align AHU operation with occupancy
    short_name: AHU schedule alignment
    category: scheduling
    equipment_types: [air_handling_unit]
    system_families: [all_air]
    retrofit_classes: [controls, rcx]
    description: End unnecessary fan and coil operation during unoccupied periods.
    engineering_rationale: Reducing runtime avoids fan energy and coincident heating and cooling.
    required_inputs: [baseline_annual_hours, proposed_annual_hours, equipment_kw]
    optional_inputs: [average_load_fraction]
    proxy_calculator: schedule_reduction
    energyplus_patch: fan_avail_occupied_office
    conceptual_surrogate: false
    unit_contract: {equipment_kw: kW, baseline_annual_hours: h/year, savings: kWh/year}
    applicability_checks: [Confirm occupancy schedule, Confirm safe warmup and cooldown]
    incompatibilities: []
    dependencies: []
    default_cost_model: {basis: "$/AHU", low: 500.0, high: 3000.0}
    default_measure_life: 10
    default_maintenance_cost: 0.0
    comfort_risk: low
    iaq_risk: medium
    humidity_risk: medium
    implementation_complexity: low
    confidence: medium
    public_sources: [ASHRAE Guideline 36-2021, DOE Advanced Energy Retrofit Guides]
    status: PRODUCTION_PROXY_AND_ENERGYPLUS

  - <<: *defaults
    ecm_id: ECM-AHU-OPT-START-STOP
    display_name: Add optimum start and stop
    short_name: Optimum start-stop
    category: scheduling
    description: Adapt AHU start and stop times to weather and zone recovery.
    engineering_rationale: Adaptive starts reduce excess runtime while preserving occupied comfort.
    required_inputs: [occupied_schedule, zone_temperature_trends, outdoor_air_temperature]
    optional_inputs: [thermal_mass_class]
    proxy_calculator: schedule_reduction
    energyplus_patch: null
    unit_contract: {schedule: local_time, temperature: degC, savings: kWh/year}
    applicability_checks: [Trend zone recovery before deployment]
    status: PRODUCTION_PROXY_ONLY

  - <<: *defaults
    ecm_id: ECM-HOLIDAY-SCHED
    display_name: Correct holiday and exception schedules
    short_name: Holiday scheduling
    category: scheduling
    description: Add verified holidays and shutdown exceptions to occupied schedules.
    engineering_rationale: Exception schedules prevent full operation on predictably vacant days.
    required_inputs: [holiday_calendar, baseline_schedule]
    optional_inputs: [special_event_calendar]
    proxy_calculator: schedule_reduction
    energyplus_patch: null
    unit_contract: {schedule: local_time, savings: kWh/year}
    applicability_checks: [Confirm facility holiday calendar]
    status: PRODUCTION_PROXY_ONLY

