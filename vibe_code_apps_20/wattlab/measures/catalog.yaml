    unit_contract: {outside_air_cfm: CFM, average_delta_t_f: deltaF, savings: kWh/year}
    applicability_checks: [Verify damper linkage, Verify minimum ventilation]
    iaq_risk: high
    status: PRODUCTION_PROXY_ONLY

