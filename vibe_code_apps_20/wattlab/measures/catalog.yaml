    engineering_rationale: Correct damper control avoids excess conditioning while maintaining ventilation.
    required_inputs: [oa_damper_command, mixed_air_temperature, outdoor_air_temperature]
    optional_inputs: [return_air_temperature, measured_oa_cfm]
