[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "wattlab"
version = "0.2.0"
description = "WattLab: EnergyPlus digital-twin toolkit — vibe19 FDD dumps in, calibrated models + ESCO-grade ECM economics out."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ben Bartling" }]
dependencies = [
  "pandas>=2.0",
  "numpy>=1.24",
  "pydantic>=2.7",
  "PyYAML>=6.0",
  # Generic ECM / spreadsheet engineering math (fan affinity, bins, finance helpers).
  # Local wattlab.bench duplicates remain until parity tests pass, then delete.
  "open-fdd>=4.0.0,<5",
]

[project.optional-dependencies]
studio = ["streamlit>=1.37", "plotly>=5.20", "matplotlib>=3.8", "openpyxl>=3.1", "python-docx>=1.1"]
excel = ["openpyxl>=3.1"]
docx = ["python-docx>=1.1"]
dev = ["pytest>=8.0", "ruff>=0.5", "playwright>=1.40"]

[project.scripts]
wattlab = "wattlab.cli:main"

# packages=["wattlab"] already ships everything under wattlab/ (data JSONs,
# measure sets). Do NOT re-add force-include for those paths — hatchling
# raises "second file added at the same path" when building a real wheel.
[tool.hatch.build.targets.wheel]
packages = ["wattlab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
