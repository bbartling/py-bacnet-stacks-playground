[adapters]
model = "Waveshare USB TO RS485 (C)"
port_a = "/dev/serial/by-id/usb-FTDI_FT232R_USB_UART_BH002I9S-if00-port0"
port_b = "/dev/serial/by-id/usb-FTDI_FT232R_USB_UART_BH001FQ0-if00-port0"

[serial]
baud = 38400
data_bits = 8
parity = "none"
stop_bits = 1
flow_control = "none"
direction = "auto"

[test]
rounds = 10000
max_payload = 256
seed = 1337
turnaround_guard_ms = 5
report = "reports/phase1-wire-test.json"

