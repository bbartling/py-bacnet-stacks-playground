# CI-only fixture — documentation IPs; never contact real Pis from GitHub Actions.
all:
  children:
    vibe13_pi_lab:
      vars:
        ansible_user: ben
        lab_baud: 38400
        lab_max_master: 2
        lab_allow_serial_tx: false
        lab_allowed_hosts:
          workerpi1: "198.51.100.59"
          workerpi2: "198.51.100.60"
      hosts:
        workerpi1:
          ansible_host: 198.51.100.59
          lab_role: server
          lab_mstp_mac: 1
          lab_device_instance: 123101
          lab_peer: workerpi2
          lab_serial_by_id: "/dev/serial/by-id/usb-FTDI_FIXTURE"
          lab_adapter_model: waveshare_b
        workerpi2:
          ansible_host: 198.51.100.60
          lab_role: probe
          lab_mstp_mac: 2
          lab_device_instance: 123102
          lab_peer: workerpi1
          lab_serial_by_id: "/dev/serial/by-id/usb-CH343_FIXTURE"
          lab_adapter_model: waveshare_c
