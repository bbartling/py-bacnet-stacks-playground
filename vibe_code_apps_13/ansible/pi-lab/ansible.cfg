[defaults]
inventory = inventory.local.yml
interpreter_python = auto_silent
retry_files_enabled = False
host_key_checking = True
stdout_callback = default
callbacks_enabled = profile_tasks
roles_path = roles
collections_path = .collections:~/.ansible/collections:/usr/share/ansible/collections
gathering = smart
timeout = 30

# ansible-core 2.16+ may use ssh_askpass; pin sshpass for --ask-pass bootstrap.
[ssh_connection]
password_mechanism = sshpass
ssh_args = -o ServerAliveInterval=30 -o ServerAliveCountMax=6 -o IdentitiesOnly=yes
pipelining = True
