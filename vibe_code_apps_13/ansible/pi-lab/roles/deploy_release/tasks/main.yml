---
- name: Require release artifact on controller
  ansible.builtin.stat:
    path: "{{ playbook_dir }}/../files/releases/{{ lab_release_id }}"
  register: art
  delegate_to: localhost
  become: false
  run_once: true

- name: Fail when artifact missing
  ansible.builtin.assert:
    that:
      - art.stat.exists
      - art.stat.isdir
    fail_msg: >-
      Missing files/releases/{{ lab_release_id }}. Build on the tower first
      (./scripts/pi-lab build --revision {{ lab_release_id }}).
  run_once: true

- name: Sync release directory to target
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../files/releases/{{ lab_release_id }}/"
    dest: "{{ lab_install_root }}/releases/{{ lab_release_id }}/"
    owner: root
    group: root
    mode: preserve
    directory_mode: "0755"

- name: Verify SHA256SUMS and MANIFEST after transfer
  ansible.builtin.shell: |
    set -euo pipefail
    cd "{{ lab_install_root }}/releases/{{ lab_release_id }}"
    test -f MANIFEST.json
    test -f SHA256SUMS
    sha256sum -c SHA256SUMS
    python3 - <<'PY'
    import json, pathlib
    m=json.loads(pathlib.Path("MANIFEST.json").read_text())
    assert m.get("release_id") == "{{ lab_release_id }}", m
    assert m.get("target_triple","").startswith("aarch64"), m
    print("manifest ok")
    PY
    for b in mstp-mini-device mstp-probe vibe13-observer vibe13-raw-peer; do
      python3 - <<PY
    import struct
    p="bin/$b"
    with open(p,"rb") as f: hdr=f.read(20)
    assert hdr[:4]==b"\\x7fELF", p
    machine=struct.unpack_from("<H", hdr, 18)[0]
    assert machine==183, (p, machine)
    print("elf ok", p)
    PY
    done
  args:
    executable: /bin/bash
  changed_when: false

- name: Activate current symlink atomically
  ansible.builtin.shell: |
    set -euo pipefail
    dest="{{ lab_install_root }}/current"
    tmp="{{ lab_install_root }}/.current.tmp.$$"
    ln -sfn "{{ lab_install_root }}/releases/{{ lab_release_id }}" "$tmp"
    mv -Tf "$tmp" "$dest"
  args:
    executable: /bin/bash

- name: Install host config
  ansible.builtin.template:
    src: host.env.j2
    dest: "{{ lab_etc_root }}/{{ inventory_hostname }}.env"
    owner: root
    group: "{{ lab_service_user }}"
    mode: "0640"

- name: Install systemd units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - vibe13-mini-device.service
    - vibe13-probe.service
    - vibe13-observer.service
    - vibe13-raw-peer.service
  notify: Reload systemd

- name: Flush handlers
  ansible.builtin.meta: flush_handlers
