---
# Read-only discovery — NEVER open serial / MS/TP / TX.
- name: Vibe13 Pi lab discover (no serial open)
  hosts: vibe13_pi_lab
  gather_facts: true
  become: false
  any_errors_fatal: true
  vars:
    lab_scripts: "{{ playbook_dir }}/../scripts"
  pre_tasks:
    - name: Trusted host allowlist
      ansible.builtin.command:
        argv: >-
          {{
            [
              'python3',
              lab_scripts + '/lab_ids.py',
              'check-host',
              inventory_hostname,
              ansible_host
            ] + (['--ci-doc'] if (lab_ci_doc | default(false) | bool) else [])
          }}
      delegate_to: localhost
      become: false
      changed_when: false
  roles:
    - role: discover_serial
  tasks:
    - name: Ensure controller discovery report dir
      ansible.builtin.file:
        path: "{{ playbook_dir }}/../reports/pi-lab/{{ lab_run_id | default('discover') }}"
        state: directory
        mode: "0755"
      delegate_to: localhost
      become: false
      run_once: true

    - name: Write per-host discovery JSON on controller
      ansible.builtin.copy:
        dest: "{{ playbook_dir }}/../reports/pi-lab/{{ lab_run_id | default('discover') }}/{{ inventory_hostname }}.json"
        content: "{{ hostvars[inventory_hostname].lab_discovery | to_nice_json }}\n"
        mode: "0644"
      delegate_to: localhost
      become: false
      when: hostvars[inventory_hostname].lab_discovery is defined
