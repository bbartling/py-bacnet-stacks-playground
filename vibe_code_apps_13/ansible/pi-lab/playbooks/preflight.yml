---
# Validate trusted hosts via controller allowlist; refuse localhost/tower; TX default false.
# lab_allowed_hosts in inventory is documentation only — TRUSTED_HOSTS is authoritative.
- name: Vibe13 Pi lab preflight
  hosts: vibe13_pi_lab
  gather_facts: false
  any_errors_fatal: true
  vars:
    lab_scripts: "{{ playbook_dir }}/../scripts"
  tasks:
    - name: Trusted host allowlist (controller code)
      ansible.builtin.command:
        argv: >-
          {{
            [
              'python3',
              lab_scripts + '/lab_ids.py',
              'check-host',
              inventory_hostname,
              ansible_host
            ] + (['--ci-doc'] if (lab_ci_doc | default(false) | bool) else [])
          }}
      delegate_to: localhost
      become: false
      changed_when: false

    - name: Reject controller as target
      ansible.builtin.assert:
        that:
          - ansible_connection != 'local'
          - ansible_host is not match('^127\\.')
          - ansible_host != 'localhost'
        fail_msg: Controller/localhost must not be a Pi-lab target.

    - name: Serial TX must be off until wiring confirmed
      ansible.builtin.assert:
        that:
          - not (lab_allow_serial_tx | bool)
        fail_msg: >-
          lab_allow_serial_tx is true. Run confirm-wiring and set the wiring
          manifest before enabling TX. Preflight refuses default TX.

    - name: Unique MAC and role sanity (pair)
      ansible.builtin.assert:
        that:
          - lab_mstp_mac is defined
          - lab_role in ['server', 'probe']
          - lab_device_instance | int != 123001
        fail_msg: Invalid role/MAC or device instance collides with tower 123001.

    - name: TCP port 22 reachable (short timeout)
      ansible.builtin.wait_for:
        host: "{{ ansible_host }}"
        port: 22
        timeout: 8
        state: started
      delegate_to: localhost
      become: false
      when: not (lab_ci_doc | default(false) | bool)

    - name: Ansible ping (SSH + Python)
      ansible.builtin.ping:
      when: not (lab_ci_doc | default(false) | bool)
