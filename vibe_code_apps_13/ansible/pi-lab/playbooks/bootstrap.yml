---
# Key bootstrap: non-exclusive authorized_key; password SSH unchanged.
# Prefer existing tower key (already on workerpis). Optional --ask-pass.
- name: Vibe13 Pi lab SSH bootstrap
  hosts: vibe13_pi_lab
  gather_facts: true
  become: false
  any_errors_fatal: true
  vars:
    lab_scripts: "{{ playbook_dir }}/../scripts"
  pre_tasks:
    - name: Trusted host allowlist
      ansible.builtin.command:
        argv: >-
          {{
            [
              'python3',
              lab_scripts + '/lab_ids.py',
              'check-host',
              inventory_hostname,
              ansible_host
            ] + (['--ci-doc'] if (lab_ci_doc | default(false) | bool) else [])
          }}
      delegate_to: localhost
      become: false
      changed_when: false
  roles:
    - role: ssh_bootstrap
  tasks:
    - name: Verify key-only SSH after bootstrap
      ansible.builtin.ping:
      vars:
        ansible_ssh_private_key_file: "{{ lab_ssh_private_key | default(omit) }}"
      when: not (lab_ci_doc | default(false) | bool)
