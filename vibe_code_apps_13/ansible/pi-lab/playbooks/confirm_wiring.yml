---
# Operator wiring gate — writes bounded gitignored wiring.local.yml after inventory load.
# Mere existence of an old file is NOT enough for TX; run.yml re-validates every field.
- name: Vibe13 confirm wiring (no TX yet)
  hosts: localhost
  connection: local
  gather_facts: true
  vars:
    lab_wiring_file: "{{ playbook_dir }}/../wiring.local.yml"
    lab_inventory: "{{ lookup('env', 'PI_LAB_INVENTORY') | default(playbook_dir + '/../inventory.local.yml', true) }}"
  tasks:
    - name: Require operator confirmation flag
      ansible.builtin.assert:
        that:
          - lab_wiring_confirmed | default(false) | bool
        fail_msg: >-
          Physical gate not confirmed. Wire workerpi1(C/FTDI) ↔ workerpi2(B/CH343) ONLY
          (no tower/FEC/BASRT). Then:
            ./scripts/pi-lab confirm-wiring --confirmed
          Checklist: A+ to A+, B- to B-, GND to GND, both onboard ~120ohm terminations,
          unpowered pair ~60-65ohm, baud 38400, MAC 1+2, Max_Master 2, one process per tty.

    - name: Load inventory for identity digest
      ansible.builtin.slurp:
        src: "{{ lab_inventory }}"
      register: inv_slurp
      failed_when: false

    - name: Fail when inventory missing
      ansible.builtin.assert:
        that:
          - inv_slurp.content is defined
        fail_msg: "Missing inventory (set PI_LAB_INVENTORY or inventory.local.yml)."

    - name: Parse inventory hosts
      ansible.builtin.set_fact:
        inv_data: "{{ inv_slurp.content | b64decode | from_yaml }}"

    - name: Extract pair hosts
      ansible.builtin.set_fact:
        h1: "{{ inv_data.all.children.vibe13_pi_lab.hosts.workerpi1 }}"
        h2: "{{ inv_data.all.children.vibe13_pi_lab.hosts.workerpi2 }}"
        gvars: "{{ inv_data.all.children.vibe13_pi_lab.vars }}"

    - name: Assert chipset↔model map (C=FTDI, B=CH343)
      ansible.builtin.assert:
        that:
          - h1.lab_adapter_model == 'waveshare_c'
          - h1.lab_adapter_vid_pid == '0403:6001'
          - h2.lab_adapter_model == 'waveshare_b'
          - h2.lab_adapter_vid_pid == '1a86:55d3'
        fail_msg: >-
          Inventory model/VID map does not match official Waveshare C=FTDI / B=CH343.
          Fix inventory after operator label confirmation; do not invent swaps.

    - name: Controller project SHA
      ansible.builtin.command: git -C "{{ playbook_dir }}/../../.." rev-parse HEAD
      register: ctrl_sha
      changed_when: false

    - name: Inventory digest
      ansible.builtin.set_fact:
        inv_digest: "{{ inv_slurp.content | b64decode | hash('sha256') }}"

    - name: Write wiring approval manifest (non-secret, gitignored)
      ansible.builtin.copy:
        dest: "{{ lab_wiring_file }}"
        mode: "0644"
        content: |
          # Generated by confirm-wiring — not a secret. Validity 8h.
          schema: vibe13_wiring_v1
          schema_version: 1
          approved_utc: "{{ ansible_date_time.iso8601 }}"
          max_age_hours: 8
          controller_project_sha: "{{ ctrl_sha.stdout }}"
          inventory_digest_sha256: "{{ inv_digest }}"
          pair: cb
          topology: isolated_direct_wire
          polarity: "A+ to A+, B- to B-, GND to GND"
          endpoints: 2
          each_onboard_termination_ohm: 120
          unpowered_pair_resistance_ohm: "{{ lab_unpowered_resistance_ohm | default('OPERATOR_MEASURE') }}"
          operator_confirmed: true
          requested_profile: "{{ lab_requested_profile | default('mstp-smoke') }}"
          baud: {{ gvars.lab_baud | default(38400) }}
          max_master: {{ gvars.lab_max_master | default(2) }}
          max_info_frames: {{ gvars.lab_max_info_frames | default(1) }}
          hosts:
            workerpi1:
              ansible_host: "{{ h1.ansible_host }}"
              adapter_model: "{{ h1.lab_adapter_model }}"
              vid_pid: "{{ h1.lab_adapter_vid_pid }}"
              serial_short: "{{ h1.lab_adapter_serial_short | default('') }}"
              serial_by_id: "{{ h1.lab_serial_by_id }}"
              role: "{{ h1.lab_role }}"
              mac: {{ h1.lab_mstp_mac }}
              device_instance: {{ h1.lab_device_instance }}
            workerpi2:
              ansible_host: "{{ h2.ansible_host }}"
              adapter_model: "{{ h2.lab_adapter_model }}"
              vid_pid: "{{ h2.lab_adapter_vid_pid }}"
              serial_short: "{{ h2.lab_adapter_serial_short | default('') }}"
              serial_by_id: "{{ h2.lab_serial_by_id }}"
              role: "{{ h2.lab_role }}"
              mac: {{ h2.lab_mstp_mac }}
              device_instance: {{ h2.lab_device_instance }}
          notes: Isolated C+B only; tower Waveshare C and FEC out of scope. TX still off.

    - name: Reminder — TX still off until validated run
      ansible.builtin.debug:
        msg: >-
          Wiring manifest written to wiring.local.yml. lab_allow_serial_tx remains false
          until ./scripts/pi-lab run --profile … --allow-tx re-validates the manifest.
