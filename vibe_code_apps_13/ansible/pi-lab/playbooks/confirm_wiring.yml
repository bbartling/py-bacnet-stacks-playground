---
# Operator wiring gate — writes non-secret wiring.approved.yml when confirmed.
- name: Vibe13 confirm wiring (no TX yet)
  hosts: localhost
  connection: local
  gather_facts: true
  vars:
    lab_wiring_file: "{{ playbook_dir }}/../wiring.local.yml"
  tasks:
    - name: Require operator confirmation flag
      ansible.builtin.assert:
        that:
          - lab_wiring_confirmed | default(false) | bool
        fail_msg: >-
          Physical gate not confirmed. Wire workerpi1(B) ↔ workerpi2(C) ONLY
          (no tower/FEC/BASRT). Then:
            ./scripts/pi-lab confirm-wiring --confirmed
          Checklist: polarity +/+, -/-, no VCC, both ends terminated, bias known,
          baud 38400, MAC 1+2, Max_Master 2, one process per tty.

    - name: Write wiring approval manifest (non-secret)
      ansible.builtin.copy:
        dest: "{{ lab_wiring_file }}"
        mode: "0644"
        content: |
          # Generated by confirm-wiring — not a secret.
          schema: vibe13_wiring_v1
          approved_utc: "{{ ansible_date_time.iso8601 | default('unknown') }}"
          pair: bc
          topology: isolated_direct_wire
          hosts:
            workerpi1:
              adapter_model: waveshare_b
              serial_by_id: /dev/serial/by-id/usb-FTDI_FT232R_USB_UART_BH002I9S-if00-port0
              role: server
              mac: 1
              device_instance: 123101
            workerpi2:
              adapter_model: waveshare_c
              serial_by_id: /dev/serial/by-id/usb-1a86_USB_Single_Serial_5A98075745-if00
              role: probe
              mac: 2
              device_instance: 123102
          profile:
            baud: 38400
            max_master: 2
            max_info_frames: 1
          notes: Isolated B+C only; tower C and FEC out of scope.

    - name: Reminder — TX still off until run playbook
      ansible.builtin.debug:
        msg: >-
          Wiring manifest written. lab_allow_serial_tx remains false until
          ./scripts/pi-lab run --profile … sets it for that run only.
