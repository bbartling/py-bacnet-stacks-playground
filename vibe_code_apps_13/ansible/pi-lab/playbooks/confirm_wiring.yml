---
# Operator wiring gate — builds vibe13_wiring_v2 via wiring_contract (no TX).
# Mere existence of an old file is NOT enough for TX; run.yml re-validates every field.
- name: Vibe13 confirm wiring (no TX yet)
  hosts: localhost
  connection: local
  gather_facts: true
  vars:
    lab_wiring_file: "{{ playbook_dir }}/../wiring.local.yml"
    lab_inventory: "{{ lookup('env', 'PI_LAB_INVENTORY') | default(playbook_dir + '/../inventory.local.yml', true) }}"
    lab_scripts: "{{ playbook_dir }}/../scripts"
  tasks:
    - name: Require operator confirmation flag
      ansible.builtin.assert:
        that:
          - lab_wiring_confirmed | default(false) | bool
        fail_msg: >-
          Physical gate not confirmed. Wire workerpi1(C/FTDI) ↔ workerpi2(B/CH343) ONLY
          (no tower/FEC/BASRT). Then:
            ./scripts/pi-lab confirm-wiring --confirmed \
              --ohm-pi1 <N> --ohm-pi2 <N> --ohm-combined <N> \
              --bias verified|unknown|not_measured \
              --orientation workerpi1-server|workerpi2-server \
              --profile <profile> [--resistance-override-reason ...]
          Checklist: A+ to A+, B- to B-, GND to GND, both onboard ~120ohm terminations,
          unpowered pair ~60-65ohm, baud 38400, MAC 1+2, Max_Master 2, one process per tty.

    - name: Require numeric resistance extra-vars (reject OPERATOR_MEASURE)
      ansible.builtin.assert:
        that:
          - lab_workerpi1_ohm is defined
          - lab_workerpi2_ohm is defined
          - lab_combined_ohm is defined
          - lab_bias_status is defined
          - lab_orientation is defined
          - lab_requested_profile is defined
          - lab_polarity_confirmed | default(false) | bool
          - lab_no_vcc_confirmed | default(false) | bool
          - (lab_pair | default('cb')) == 'cb'
          - lab_workerpi1_ohm | string is not search('OPERATOR')
          - lab_workerpi2_ohm | string is not search('OPERATOR')
          - lab_combined_ohm | string is not search('OPERATOR')
        fail_msg: >-
          confirm-wiring requires numeric lab_workerpi1_ohm / lab_workerpi2_ohm /
          lab_combined_ohm, lab_bias_status, lab_orientation, lab_requested_profile,
          lab_polarity_confirmed=true, lab_no_vcc_confirmed=true, lab_pair=cb.
          OPERATOR_MEASURE strings are rejected.

    - name: Load inventory for identity digest
      ansible.builtin.slurp:
        src: "{{ lab_inventory }}"
      register: inv_slurp
      failed_when: false

    - name: Fail when inventory missing
      ansible.builtin.assert:
        that:
          - inv_slurp.content is defined
        fail_msg: "Missing inventory (set PI_LAB_INVENTORY or inventory.local.yml)."

    - name: Parse inventory hosts
      ansible.builtin.set_fact:
        inv_data: "{{ inv_slurp.content | b64decode | from_yaml }}"

    - name: Extract pair hosts
      ansible.builtin.set_fact:
        h1: "{{ inv_data.all.children.vibe13_pi_lab.hosts.workerpi1 }}"
        h2: "{{ inv_data.all.children.vibe13_pi_lab.hosts.workerpi2 }}"

    - name: Assert chipset↔model map (C=FTDI, B=CH343)
      ansible.builtin.assert:
        that:
          - h1.lab_adapter_model == 'waveshare_c'
          - h1.lab_adapter_vid_pid == '0403:6001'
          - h2.lab_adapter_model == 'waveshare_b'
          - h2.lab_adapter_vid_pid == '1a86:55d3'
        fail_msg: >-
          Inventory model/VID map does not match official Waveshare C=FTDI / B=CH343.
          Fix inventory after operator label confirmation; do not invent swaps.

    - name: Trusted host allowlist (controller, not inventory)
      ansible.builtin.command:
        argv: >-
          {{
            [
              'python3',
              lab_scripts + '/lab_ids.py',
              'check-host',
              item.name,
              item.ip
            ] + (['--ci-doc'] if (lab_ci_doc | default(false) | bool) else [])
          }}
      loop:
        - { name: workerpi1, ip: "{{ h1.ansible_host }}" }
        - { name: workerpi2, ip: "{{ h2.ansible_host }}" }
      changed_when: false

    - name: Controller project SHA
      ansible.builtin.command: git -C "{{ playbook_dir }}/../../.." rev-parse HEAD
      register: ctrl_sha
      changed_when: false

    - name: Stage write-manifest params
      ansible.builtin.copy:
        dest: "/tmp/vibe13-wiring-params-{{ ansible_date_time.epoch }}.json"
        mode: "0600"
        content: |
          {
            "project_sha": "{{ ctrl_sha.stdout }}",
            "upstream_sha": "af4e88680c51eb4da64dac47f0540a35bf184732",
            "pair": "{{ lab_pair | default('cb') }}",
            "orientation": "{{ lab_orientation }}",
            "profile": "{{ lab_requested_profile }}",
            "workerpi1_ohm": {{ lab_workerpi1_ohm }},
            "workerpi2_ohm": {{ lab_workerpi2_ohm }},
            "combined_ohm": {{ lab_combined_ohm }},
            "bias_status": "{{ lab_bias_status }}",
            "polarity_confirmed": true,
            "no_vcc_confirmed": true
            {% if lab_resistance_override_reason is defined and (lab_resistance_override_reason | string | length) > 0 %}
            ,"resistance_override_reason": {{ lab_resistance_override_reason | to_json }}
            {% endif %}
          }
      register: params_file

    - name: Build vibe13_wiring_v2 via wiring_contract
      ansible.builtin.command:
        argv:
          - python3
          - "{{ lab_scripts }}/wiring_contract.py"
          - write-manifest
          - "{{ lab_inventory }}"
          - "{{ lab_wiring_file }}"
          - "{{ params_file.dest }}"
      register: write_man

    - name: Remove staged params
      ansible.builtin.file:
        path: "{{ params_file.dest }}"
        state: absent

    - name: Reminder — TX still off until validated run
      ansible.builtin.debug:
        msg: >-
          Wiring manifest written to wiring.local.yml ({{ write_man.stdout }}).
          lab_allow_serial_tx remains false until ./scripts/pi-lab run --profile …
          --allow-tx re-validates the manifest (nonce single-use).
