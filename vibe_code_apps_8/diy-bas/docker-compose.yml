services:
  caddy:
    image: caddy:2.8-alpine
    container_name: diy-bas-caddy
    depends_on:
      - diy-bas
    ports:
      - "${DIY_BAS_HTTP_PORT:-80}:80"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro

  diy-bacnet-server:
    profiles: ["with-bacnet-container"]
    build:
      context: ${DIY_BACNET_SERVER_DIR:-/home/ben/diy-bacnet-server}
    container_name: diy-bacnet-server
    command: python3 -u -m bacpypes_server.main --name ${DIY_BACNET_SERVER_NAME:-BACnetServer} --instance ${DIY_BACNET_SERVER_INSTANCE:-123456} --public
    environment:
      BACNET_RPC_API_KEY: ${BACNET_RPC_API_KEY:-}
    ports:
      - "8080:8080"
      - "47808:47808/udp"

  diy-bas:
    build:
      context: .
    container_name: diy-bas
    environment:
      DIY_BACNET_URL: ${DIY_BACNET_URL:-http://host.docker.internal:8080}
      BACNET_RPC_API_KEY: ${BACNET_RPC_API_KEY:-}
      DIY_BACNET_SERVER_INSTANCE: ${DIY_BACNET_SERVER_INSTANCE:-123456}
      DIY_BAS_HIDE_GATEWAY_DEVICE: ${DIY_BAS_HIDE_GATEWAY_DEVICE:-true}
      PORT: 5050
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/app/data
