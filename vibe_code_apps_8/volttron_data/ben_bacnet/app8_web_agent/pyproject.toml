[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "app8-web-agent"
version = "0.9.0"
description = "App8 web agent for BAS Lite UI and APIs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["volttron>=10"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
