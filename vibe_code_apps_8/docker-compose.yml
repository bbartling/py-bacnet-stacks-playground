# BAS Lite — Docker + easy-aso (container-first runtime).
# See docs/BOSS_PI_BAS_LITE_DOCKER.md

name: bas-lite

services:
  diy-bacnet:
    build:
      context: ./docker/diy-bacnet
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      BACNET_RPC_API_KEY: ${BACNET_RPC_API_KEY:-}
    ports:
      # BACnet/IP — only one process per host can bind UDP 47808. If compose fails, free the port or set BACNET_UDP_HOST_PORT in .env (see .env.example).
      - "${BACNET_UDP_HOST_PORT:-47808}:47808/udp"
      # JSON-RPC + docs on the host (default 28090 avoids clashing with other stacks on 8080).
      # LAN: set DIY_BACNET_PORTS=28090:8080 (two-part form = all interfaces). Avoid 0.0.0.0 in .env on Windows CRLF.
      - "${DIY_BACNET_PORTS:-127.0.0.1:${DIY_BACNET_HOST_PORT:-28090}:8080}"
    logging: &flash_log
      driver: local
      options:
        max-size: "8m"
        max-file: "3"
    networks:
      - bas_internal
    # Root GET returns 200 without Bearer (current diy-bacnet layout); avoids /openapi.json 404 vs 401 confusion.
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # Optional: copies outside-air (or any) reading through diy-bacnet JSON-RPC using easy-aso client (no extra BACnet UDP bind).
  easy-aso-oat:
    build:
      context: ./docker/easy_aso_oat
      dockerfile: Dockerfile
    restart: unless-stopped
    profiles:
      - oat
    environment:
      SUPERVISOR_BACNET_RPC_URL: ${SUPERVISOR_BACNET_RPC_URL:-http://diy-bacnet:8080}
      SUPERVISOR_BACNET_RPC_ENTRYPOINT: ${SUPERVISOR_BACNET_RPC_ENTRYPOINT:-/api}
      BACNET_RPC_API_KEY: ${BACNET_RPC_API_KEY:-}
      OAT_INTERVAL_SEC: ${OAT_INTERVAL_SEC:-300}
      OAT_SOURCE_DEVICE: ${OAT_SOURCE_DEVICE:-}
      OAT_SOURCE_OBJECT: ${OAT_SOURCE_OBJECT:-}
      OAT_TARGET_WRITES: "${OAT_TARGET_WRITES:-[]}"
    logging: *flash_log
    networks:
      - bas_internal
    depends_on:
      diy-bacnet:
        condition: service_healthy

  # Optional: three RpcDockedEasyASO sidecars (profile agents) — OAT fan-out, GL36 VAV request accounting, GL36 SAT reset.
  easy-aso-agent-oat:
    build:
      context: ./docker/easy_aso_agent
      dockerfile: Dockerfile
    restart: unless-stopped
    profiles:
      - agents
    environment:
      SUPERVISOR_BACNET_RPC_URL: ${SUPERVISOR_BACNET_RPC_URL:-http://diy-bacnet:8080}
      SUPERVISOR_BACNET_RPC_ENTRYPOINT: ${SUPERVISOR_BACNET_RPC_ENTRYPOINT:-/api}
      BACNET_RPC_API_KEY: ${BACNET_RPC_API_KEY:-}
      EASY_ASO_AGENT_MODULE: agents.oat_share_agent
      EASY_ASO_AGENT_CLASS: OatShareAgent
      EASY_ASO_STEP_SEC: ${EASY_ASO_OAT_STEP_SEC:-300}
      OAT_SOURCE_DEVICE: ${OAT_SOURCE_DEVICE:-}
      OAT_SOURCE_OBJECT: ${OAT_SOURCE_OBJECT:-}
      OAT_TARGET_WRITES: "${OAT_TARGET_WRITES:-[]}"
    labels:
      bas-lite.easy-aso.agent: "rpc-docked"
      bas-lite.easy-aso.role: "oat-share"
    logging: *flash_log
    networks:
      - bas_internal
    depends_on:
      diy-bacnet:
        condition: service_healthy

  easy-aso-agent-gl36-vav:
    build:
      context: ./docker/easy_aso_agent
      dockerfile: Dockerfile
    restart: unless-stopped
    profiles:
      - agents
    environment:
      SUPERVISOR_BACNET_RPC_URL: ${SUPERVISOR_BACNET_RPC_URL:-http://diy-bacnet:8080}
      SUPERVISOR_BACNET_RPC_ENTRYPOINT: ${SUPERVISOR_BACNET_RPC_ENTRYPOINT:-/api}
      BACNET_RPC_API_KEY: ${BACNET_RPC_API_KEY:-}
      EASY_ASO_AGENT_MODULE: agents.gl36_vav_requests_agent
      EASY_ASO_AGENT_CLASS: Gl36VavRequestsAgent
      EASY_ASO_STEP_SEC: ${EASY_ASO_GL36_VAV_STEP_SEC:-60}
      EASY_ASO_GL36_VAV_CONFIG: "${EASY_ASO_GL36_VAV_CONFIG:-}"
    labels:
      bas-lite.easy-aso.agent: "rpc-docked"
      bas-lite.easy-aso.role: "gl36-vav-requests"
    logging: *flash_log
    networks:
      - bas_internal
    depends_on:
      diy-bacnet:
        condition: service_healthy

  easy-aso-agent-gl36-ahu:
    build:
      context: ./docker/easy_aso_agent
      dockerfile: Dockerfile
    restart: unless-stopped
    profiles:
      - agents
    environment:
      SUPERVISOR_BACNET_RPC_URL: ${SUPERVISOR_BACNET_RPC_URL:-http://diy-bacnet:8080}
      SUPERVISOR_BACNET_RPC_ENTRYPOINT: ${SUPERVISOR_BACNET_RPC_ENTRYPOINT:-/api}
      BACNET_RPC_API_KEY: ${BACNET_RPC_API_KEY:-}
      EASY_ASO_AGENT_MODULE: agents.gl36_ahu_supply_reset_agent
      EASY_ASO_AGENT_CLASS: Gl36AhuSupplyResetAgent
      EASY_ASO_STEP_SEC: ${EASY_ASO_GL36_AHU_STEP_SEC:-120}
      EASY_ASO_GL36_AHU_CONFIG: "${EASY_ASO_GL36_AHU_CONFIG:-}"
    labels:
      bas-lite.easy-aso.agent: "rpc-docked"
      bas-lite.easy-aso.role: "gl36-ahu-sat-reset"
    logging: *flash_log
    networks:
      - bas_internal
    depends_on:
      diy-bacnet:
        condition: service_healthy

  api:
    build:
      context: ./docker/bas_lite_api
      dockerfile: Dockerfile
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SUPERVISOR_DB_PATH: /data/supervisor.sqlite
      SUPERVISOR_BACNET_RPC_URL: ${SUPERVISOR_BACNET_RPC_URL:-http://diy-bacnet:8080}
      SUPERVISOR_BACNET_RPC_ENTRYPOINT: ${SUPERVISOR_BACNET_RPC_ENTRYPOINT:-/api}
      BACNET_RPC_API_KEY: ${BACNET_RPC_API_KEY:-}
      BAS_LITE_SITE_NAME: ${BAS_LITE_SITE_NAME:-Boss Pi BAS Lite}
      BAS_LITE_DRIVER_CONFIG_DIR: /data/driver_configs
      BAS_LITE_GATEWAY_TOKEN: ${BAS_LITE_GATEWAY_TOKEN:-}
    volumes:
      - bas_lite_data:/data
      # Optional host Docker introspection for System page (container status/log tails).
      # Safe read-only mount; if unavailable, API returns "dockerUnavailable" for those endpoints.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    logging: *flash_log
    networks:
      - bas_internal
    depends_on:
      diy-bacnet:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
      args:
        NODE_MAX_OLD_SPACE: ${FRONTEND_NODE_MAX_OLD_SPACE:-2048}
        FRONTEND_SKIP_NODE_BUILD: ${FRONTEND_SKIP_NODE_BUILD:-0}
    restart: unless-stopped
    environment:
      # Written into /app8/config.runtime.js at container start (same secret as api gateway check).
      BAS_LITE_GATEWAY_TOKEN: ${BAS_LITE_GATEWAY_TOKEN:-}
    logging: *flash_log
    networks:
      - bas_internal

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      # Defaults avoid privileged host :80/:443; set CADDY_HTTP_HOST_PORT / CADDY_HTTPS_HOST_PORT in .env to change.
      # LAN from your laptop: set CADDY_HTTP_PORTS=18080:80 (and CADDY_HTTPS_PORTS=18443:443) — two-part = all interfaces, no 0.0.0.0.
      - "${CADDY_HTTP_PORTS:-127.0.0.1:${CADDY_HTTP_HOST_PORT:-18080}:80}"
      - "${CADDY_HTTPS_PORTS:-127.0.0.1:${CADDY_HTTPS_HOST_PORT:-18443}:443}"
    environment:
      BAS_LITE_GATEWAY_TOKEN: ${BAS_LITE_GATEWAY_TOKEN:-}
      BAS_AUTH_USER: ${BAS_AUTH_USER:-}
      BAS_AUTH_HASH: ${BAS_AUTH_HASH:-}
    volumes:
      # Default HTTP-only lab Caddyfile; use docker/caddy/Caddyfile for TLS + Basic Auth (see .env.example).
      - ${CADDYFILE:-./docker/caddy/Caddyfile.local-dev}:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging: *flash_log
    depends_on:
      - api
      - frontend
    networks:
      - bas_internal

volumes:
  bas_lite_data:
  caddy_data:
  caddy_config:

networks:
  bas_internal:
    driver: bridge
