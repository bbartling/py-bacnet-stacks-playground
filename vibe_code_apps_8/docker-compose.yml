# BAS Lite — Docker + easy-aso (no VOLTTRON, no systemd units for the app).
# See docs/BOSS_PI_BAS_LITE_DOCKER.md

name: bas-lite

services:
  diy-bacnet:
    build:
      context: ./docker/diy-bacnet
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      BACNET_RPC_API_KEY: ${BACNET_RPC_API_KEY:-}
    ports:
      # BACnet/IP — bind on the OT LAN interface in production if you multi-home the host.
      - "47808:47808/udp"
      # JSON-RPC + docs — localhost only reduces accidental exposure; remove the bind address to publish on the LAN.
      - "127.0.0.1:8080:8080"
    logging: &flash_log
      driver: local
      options:
        max-size: "8m"
        max-file: "3"
    networks:
      - bas_internal
    # Root GET returns 200 without Bearer (current diy-bacnet layout); avoids /openapi.json 404 vs 401 confusion.
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  api:
    build:
      context: ./docker/bas_lite_api
      dockerfile: Dockerfile
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SUPERVISOR_DB_PATH: /data/supervisor.sqlite
      SUPERVISOR_BACNET_RPC_URL: ${SUPERVISOR_BACNET_RPC_URL:-http://diy-bacnet:8080}
      SUPERVISOR_BACNET_RPC_ENTRYPOINT: ${SUPERVISOR_BACNET_RPC_ENTRYPOINT:-/api}
      BACNET_RPC_API_KEY: ${BACNET_RPC_API_KEY:-}
      BAS_LITE_SITE_NAME: ${BAS_LITE_SITE_NAME:-Boss Pi BAS Lite}
      BAS_LITE_DRIVER_CONFIG_DIR: /data/driver_configs
      BAS_LITE_GATEWAY_TOKEN: ${BAS_LITE_GATEWAY_TOKEN:-}
    volumes:
      - bas_lite_data:/data
    logging: *flash_log
    networks:
      - bas_internal
    depends_on:
      diy-bacnet:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    restart: unless-stopped
    logging: *flash_log
    networks:
      - bas_internal

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      BAS_LITE_GATEWAY_TOKEN: ${BAS_LITE_GATEWAY_TOKEN}
      BAS_AUTH_USER: ${BAS_AUTH_USER}
      BAS_AUTH_HASH: ${BAS_AUTH_HASH}
    volumes:
      - ${CADDYFILE:-./docker/caddy/Caddyfile}:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging: *flash_log
    depends_on:
      - api
      - frontend
    networks:
      - bas_internal

volumes:
  bas_lite_data:
  caddy_data:
  caddy_config:

networks:
  bas_internal:
    driver: bridge
