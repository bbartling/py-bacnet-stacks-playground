name: bas-lite

services:
  volttron:
    build:
      context: .
      dockerfile: Dockerfile
    image: bas-lite-volttron:local
    restart: unless-stopped
    hostname: bas-lite-volttron
    environment:
      VOLTTRON_HOME: ${VOLTTRON_HOME:-/home/volttron/datavolume/volttron_home}
      APP8_CONFIG_PATH: /workspace/volttron_data/ben_bacnet/app8_web_agent/config
    ports:
      - "127.0.0.1:${APP8_HTTP_HOST_PORT:-18080}:8080"
      - "${APP8_ZMQ_HOST_PORT:-22916}:22916"
    volumes:
      - volttron_datavolume:/home/volttron/datavolume
      - ./volttron_data:/workspace/volttron_data
      - ./docker/volttron/start-volttron.sh:/workspace/start-volttron.sh:ro
    logging: &flash_log
      driver: local
      options:
        max-size: "8m"
        max-file: "3"
    entrypoint: ["/bin/bash", "/workspace/start-volttron.sh"]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8080/app8/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  caddy:
    profiles: ["caddy"]
    image: caddy:2.8-alpine
    restart: unless-stopped
    depends_on:
      - volttron
    ports:
      - "127.0.0.1:${CADDY_HTTP_PORT:-18088}:80"
      - "127.0.0.1:${CADDY_HTTPS_PORT:-18443}:443"
    environment:
      BAS_AUTH_USER: ${BAS_AUTH_USER:-}
      BAS_AUTH_HASH: ${BAS_AUTH_HASH:-}
    volumes:
      - ${CADDYFILE:-./docker/caddy/Caddyfile.local-dev}:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging: *flash_log

volumes:
  volttron_datavolume:
  caddy_data:
  caddy_config:
