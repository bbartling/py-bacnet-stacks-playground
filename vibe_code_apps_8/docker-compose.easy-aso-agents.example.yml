# Optional fourth (or replacement) RpcDocked agent — merge with the main compose file.
# The stock compose file already defines easy-aso-agent-oat, easy-aso-agent-gl36-vav, and easy-aso-agent-gl36-ahu.
#
#   docker compose -f docker-compose.yml -f docker-compose.easy-aso-agents.example.yml --profile agents up -d
#
# Requires profile "agents" on every extra agent service so they stay opt-in.

services:
  easy-aso-agent-extra:
    build:
      context: ./docker/easy_aso_agent
      dockerfile: Dockerfile
    restart: unless-stopped
    profiles:
      - agents
    environment:
      SUPERVISOR_BACNET_RPC_URL: ${SUPERVISOR_BACNET_RPC_URL:-http://diy-bacnet:8080}
      SUPERVISOR_BACNET_RPC_ENTRYPOINT: ${SUPERVISOR_BACNET_RPC_ENTRYPOINT:-/api}
      BACNET_RPC_API_KEY: ${BACNET_RPC_API_KEY:-}
      EASY_ASO_AGENT_MODULE: ${EASY_ASO_AGENT_EXTRA_MODULE:-easy_aso.runtime.sample_agent}
      EASY_ASO_AGENT_CLASS: ${EASY_ASO_AGENT_EXTRA_CLASS:-SampleAgent}
      EASY_ASO_STEP_SEC: ${EASY_ASO_AGENT_EXTRA_STEP_SEC:-45}
    labels:
      bas-lite.easy-aso.agent: "rpc-docked"
      bas-lite.easy-aso.role: ${EASY_ASO_AGENT_EXTRA_ROLE:-sample}
    logging:
      driver: local
      options:
        max-size: "8m"
        max-file: "3"
    networks:
      - bas_internal
    depends_on:
      diy-bacnet:
        condition: service_healthy
