# Hub-style layout (see https://hub.docker.com/r/eclipsevolttron/volttron).
# Used as reference / bind-mount if you switch to eclipsevolttron/volttron + setup-platform.
# The default bas-lite image uses start-volttron.sh + service_config.yml instead of setup-platform.py.
config:
  vip-address: tcp://0.0.0.0:22916
  bind-web-address: http://0.0.0.0:8080
  instance-name: bas-lite-app8
  message-bus: zmq

services:
  volttron.services.web:
    libraries:
      - volttron-lib-web
    enabled: true
    kwargs:
      bind_web_address: http://0.0.0.0:8080
      web_secret_key: app8-local-dev-secret-key

agents:
  ben.app8.web:
    source: /workspace/volttron_data/ben_bacnet/app8_web_agent
    config: $CONFIG/ben.app8.web.config
    tag: app8web
