[project]
name = "bas-lite-api"
version = "0.1.0"
description = "BAS Lite Docker API — easy-aso supervisor + App8 legacy /app8/api routes"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "easy-aso[platform]>=0.1.3,<0.2",
  "httpx>=0.27",
  "psutil>=6.0",
]

[project.optional-dependencies]
dev = ["uvicorn[standard]>=0.30"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["bas_lite_api*"]
