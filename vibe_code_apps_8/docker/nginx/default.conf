server {
    listen 80;
    root /usr/share/nginx/html;
    include /etc/nginx/mime.types;

    # Never SPA-fallback for static bundles: missing chunk → real 404 (easier to spot sync/build issues).
    location ^~ /app8/assets/ {
        try_files $uri =404;
    }

    location /app8/ {
        try_files $uri $uri/ /app8/index.html;
    }

    location = / {
        return 302 /app8/;
    }
}
