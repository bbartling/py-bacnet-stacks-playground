<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Vibe 24 — Live RTU Twin</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header>
    <h1>Vibe 24 Live Twin</h1>
    <p class="claim">SURROGATE_PLANT_V1 · UI writes at BACnet priority <strong>8</strong></p>
  </header>

  <main class="graphic">
    <section class="house">
      <h2>Zone</h2>
      <div class="metric"><span>ZONE-T</span><strong id="ZONE-T">—</strong><em>°F</em></div>
      <div class="metric"><span>OA-T</span><strong id="OA-T">—</strong><em>°F</em></div>
      <div class="sp">
        <label>HEAT-SP <input id="in-HEAT-SP" type="number" step="0.5" /></label>
        <button data-write="HEAT-SP">Write prio 8</button>
        <button data-rel="HEAT-SP" class="ghost">Relinquish 8</button>
      </div>
      <div class="sp">
        <label>COOL-SP <input id="in-COOL-SP" type="number" step="0.5" /></label>
        <button data-write="COOL-SP">Write prio 8</button>
        <button data-rel="COOL-SP" class="ghost">Relinquish 8</button>
      </div>
    </section>

    <section class="rtu">
      <h2>RTU</h2>
      <div class="metric"><span>RTU-KW</span><strong id="RTU-KW">—</strong><em>kW</em></div>
      <div class="metric"><span>FAN-S</span><strong id="FAN-S">—</strong></div>
      <div class="metric"><span>MODE</span><strong id="MODE">—</strong></div>
      <div class="sp">
        <label>UNIT-ENABLE
          <select id="in-UNIT-ENABLE">
            <option value="1">On</option>
            <option value="0">Off</option>
          </select>
        </label>
        <button data-write="UNIT-ENABLE">Write prio 8</button>
        <button data-rel="UNIT-ENABLE" class="ghost">Relinquish 8</button>
      </div>
    </section>
  </main>

  <section class="table-wrap">
    <h2>Point bus</h2>
    <table id="points">
      <thead>
        <tr><th>Name</th><th>PV</th><th>Win prio</th><th>Source</th><th>Kind</th></tr>
      </thead>
      <tbody></tbody>
    </table>
  </section>

  <script src="/static/app.js"></script>
</body>
</html>
