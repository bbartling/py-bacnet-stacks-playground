# Open-FDD DataFusion SQL templates — dual backend with pandas cookbook_rules.py
# Params use ${param_name} placeholders substituted before execution.

rules:
  SV-RANGE:
    title: Sensor out of hard range
    confirmation_seconds: 300
    sql: |
      SELECT timestamp, equipment_id, oa_t,
        CASE WHEN oa_t IS NOT NULL AND (oa_t < -60 OR oa_t > 130) THEN true
             WHEN sat IS NOT NULL AND (sat < 30 OR sat > 150) THEN true
             WHEN zn_t IS NOT NULL AND (zn_t < 40 OR zn_t > 100) THEN true
             ELSE false END AS fault_raw
      FROM telemetry_pivot
      WHERE equipment_id = '${equipment_id}'

  SV-FLATLINE:
    title: Sensor flatline (stuck)
    confirmation_seconds: 300
    sql: |
      SELECT timestamp, equipment_id, zn_t,
        CASE WHEN zn_t IS NOT NULL
          AND ABS(zn_t - LAG(zn_t) OVER (ORDER BY timestamp)) <= ${flatline_tol}
          THEN true ELSE false END AS fault_raw
      FROM telemetry_pivot
      WHERE equipment_id = '${equipment_id}' AND zn_t IS NOT NULL

  VAV-1:
    title: Zone comfort band
    confirmation_seconds: 900
    sql: |
      SELECT timestamp, equipment_id, zn_t,
        CASE WHEN zn_t IS NOT NULL AND (zn_t < ${zone_lo} OR zn_t > ${zone_hi})
          THEN true ELSE false END AS fault_raw
      FROM telemetry_pivot
      WHERE equipment_id = '${equipment_id}'

  OAT-METEO:
    title: BAS OAT vs Open-Meteo
    confirmation_seconds: 900
    sql: |
      SELECT timestamp, equipment_id, oa_t,
        CASE WHEN oa_t IS NOT NULL AND ABS(oa_t - ${wx_oa_t}) > ${oat_err}
          THEN true ELSE false END AS fault_raw
      FROM telemetry_pivot
      WHERE equipment_id = '${equipment_id}'

  MOTOR-EXCESS:
    title: Motor running unoccupied
    confirmation_seconds: 1800
    sql: |
      SELECT timestamp, equipment_id, fan_cmd,
        CASE WHEN fan_cmd IS NOT NULL AND fan_cmd > 0.05 THEN true ELSE false END AS fault_raw
      FROM telemetry_pivot
      WHERE equipment_id = '${equipment_id}'
