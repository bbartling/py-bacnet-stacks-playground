# vibe19 analyst + open-fdd edge sidecar (shared historian volume)
#
# Usage (from vibe_code_apps_19/):
#   docker compose -f fdd_app/docker-compose.sidecar.yml up
#
# Requires open-fdd edge image built separately:
#   cd ../open-fdd/edge && docker build -t openfdd-edge .

services:
  vibe19-api:
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      DASHBOARD_MODE: full
      ANALYST_ENABLED: "1"
      HVAC_DATA_ROOT: /data/hvac
      HVAC_BUILDING: BUILDING_100
      OPENFDD_EDGE_URL: http://openfdd-edge:9090
      OPENFDD_HISTORIAN_SUBDIR: vibe19_building100
      OPENFDD_WORKSPACE: /openfdd-workspace
      OPENFDD_AUTO_EXPORT: "1"
      OPENFDD_USE_SIDECAR: "1"
    volumes:
      - ${HVAC_DATA_HOST:-./data/hvac_systems_CLEANED}:/data/hvac:ro
      - openfdd-historian:/openfdd-workspace/data/historian
    depends_on:
      - openfdd-edge

  openfdd-edge:
    image: openfdd-edge:latest
    ports:
      - "9090:9090"
    environment:
      OPENFDD_WORKSPACE: /workspace
      OPENFDD_HISTORIAN_SUBDIR: vibe19_building100
    volumes:
      - openfdd-historian:/workspace/data/historian
    # Build from open-fdd repo if image missing:
    # build:
    #   context: ../../../open-fdd/edge
    #   dockerfile: Dockerfile

volumes:
  openfdd-historian:
