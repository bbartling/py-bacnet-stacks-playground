[project]
name = "vibe19-fdd-demo"
version = "0.1.0"
description = "Educational pandas/Streamlit FDD demo for BUILDING_100-style CSV data"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "pyyaml>=6.0",
    "streamlit>=1.28",
    "plotly>=5.18",
    "duckdb>=0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
