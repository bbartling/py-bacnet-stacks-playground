# Pretend field BACnet sibling — advisory JSON only. No WriteProperty.
# Office: copy daily_policy.pkl into ./shared then:
#   docker compose -f bacnet/sidecar/docker-compose.yml up --build
services:
  bacnet-sidecar:
    build:
      context: ../..
      dockerfile: bacnet/sidecar/Dockerfile
    environment:
      POLICY_PACK: /shared/daily_policy.pkl
      PROPOSAL_OUT: /shared/proposed_setpoints.json
      TICK_DAY: "2026-01-26"
    volumes:
      - ./shared:/shared
    command: ["python", "/app/bacnet/sidecar/entrypoint.py"]
