<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#071827"/><stop offset="1" stop-color="#15394e"/></linearGradient>
    <style>
      .title{font:700 45px Inter,Segoe UI,Arial,sans-serif;fill:#fff}.sub{font:400 21px Inter,Segoe UI,Arial,sans-serif;fill:#bad7e4}
      .h{font:700 29px Inter,Segoe UI,Arial,sans-serif;fill:#fff}.t{font:400 19px Inter,Segoe UI,Arial,sans-serif;fill:#dbe9ef}
      .small{font:600 16px Inter,Segoe UI,Arial,sans-serif;fill:#9ecbd9}.card{fill:#163e55;stroke:#3e748b;stroke-width:2}
      .ppo{fill:#0d6375;stroke:#5cd0df;stroke-width:3}.dqn{fill:#493d70;stroke:#aa91ef;stroke-width:3}.cell{fill:#66549a;stroke:#c1aff4;stroke-width:1}
      .axis{stroke:#89bfce;stroke-width:2}.dot{fill:#70d7e4}.q{fill:#8d77cf}
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg3)"/>
  <text x="80" y="82" class="title">PPO and DQN do not search the same action space</text>
  <text x="80" y="122" class="sub">PPO adjusts 11 continuous values. DQN chooses one of 64 coarse daily templates.</text>

  <rect x="70" y="180" width="705" height="610" rx="30" class="ppo"/>
  <text x="110" y="230" class="small">PPO — CONTINUOUS BOX(11)</text>
  <text x="110" y="276" class="h">Fine-grained daily plan</text>
  <text x="110" y="322" class="t">Occupied setpoint</text><text x="690" y="322" class="t" text-anchor="end">68–72°F</text>
  <line x1="350" y1="314" x2="590" y2="314" class="axis"/><circle cx="510" cy="314" r="9" class="dot"/>
  <text x="110" y="373" class="t">Unoccupied setpoint</text><text x="690" y="373" class="t" text-anchor="end">58–68°F</text>
  <line x1="350" y1="365" x2="590" y2="365" class="axis"/><circle cx="455" cy="365" r="9" class="dot"/>
  <text x="110" y="424" class="t">Occupancy start</text><text x="690" y="424" class="t" text-anchor="end">steps 20–40</text>
  <line x1="350" y1="416" x2="590" y2="416" class="axis"/><circle cx="475" cy="416" r="9" class="dot"/>
  <text x="110" y="475" class="t">Occupancy end</text><text x="690" y="475" class="t" text-anchor="end">steps 60–80</text>
  <line x1="350" y1="467" x2="590" y2="467" class="axis"/><circle cx="525" cy="467" r="9" class="dot"/>
  <text x="110" y="526" class="t">Recovery lead</text><text x="690" y="526" class="t" text-anchor="end">0–180 min</text>
  <line x1="350" y1="518" x2="590" y2="518" class="axis"/><circle cx="560" cy="518" r="9" class="dot"/>
  <text x="110" y="577" class="t">Six zone offsets</text><text x="700" y="577" class="t" text-anchor="end">−3 to +1°F per zone</text>
  <g transform="translate(350 555)"><line y1="14" x2="190" y2="14" class="axis"/><circle cx="18" cy="14" r="7" class="dot"/><circle cx="50" cy="14" r="7" class="dot"/><circle cx="82" cy="14" r="7" class="dot"/><circle cx="114" cy="14" r="7" class="dot"/><circle cx="146" cy="14" r="7" class="dot"/><circle cx="178" cy="14" r="7" class="dot"/></g>
  <text x="110" y="646" class="t">Policy output: a distribution over this box</text>
  <text x="110" y="688" class="t">Visualization: action traces + bound saturation</text>
  <text x="110" y="730" class="small">MORE EXPRESSIVE — HARDER TO EXPLORE AND VALIDATE</text>

  <rect x="825" y="180" width="705" height="610" rx="30" class="dqn"/>
  <text x="865" y="230" class="small">DQN — DISCRETE(64)</text>
  <text x="865" y="276" class="h">Coarse daily templates</text>
  <text x="865" y="320" class="t">4 unoccupied SP × 4 recovery leads × 4 shared setbacks</text>
  <g transform="translate(885 355)">
    <rect x="0" y="0" width="56" height="38" rx="5" class="cell"/><rect x="68" y="0" width="56" height="38" rx="5" class="cell"/><rect x="136" y="0" width="56" height="38" rx="5" class="cell"/><rect x="204" y="0" width="56" height="38" rx="5" class="cell"/>
    <rect x="0" y="50" width="56" height="38" rx="5" class="cell"/><rect x="68" y="50" width="56" height="38" rx="5" class="cell"/><rect x="136" y="50" width="56" height="38" rx="5" class="cell"/><rect x="204" y="50" width="56" height="38" rx="5" class="cell"/>
    <rect x="0" y="100" width="56" height="38" rx="5" class="cell"/><rect x="68" y="100" width="56" height="38" rx="5" class="cell"/><rect x="136" y="100" width="56" height="38" rx="5" class="cell"/><rect x="204" y="100" width="56" height="38" rx="5" class="cell"/>
    <rect x="0" y="150" width="56" height="38" rx="5" class="cell"/><rect x="68" y="150" width="56" height="38" rx="5" class="cell"/><rect x="136" y="150" width="56" height="38" rx="5" class="cell"/><rect x="204" y="150" width="56" height="38" rx="5" class="cell"/>
    <text x="300" y="28" class="t">× 4 shared setbacks</text>
    <text x="300" y="78" class="t">= 64 actions</text>
    <text x="300" y="128" class="t">Occ SP fixed at 70°F</text>
    <text x="300" y="178" class="t">Start/end window fixed</text>
  </g>
  <text x="865" y="606" class="t">Neural Q-function: context → 64 Q-values</text>
  <g transform="translate(875 635)">
    <rect x="0" y="35" width="9" height="35" class="q"/><rect x="13" y="20" width="9" height="50" class="q"/><rect x="26" y="42" width="9" height="28" class="q"/><rect x="39" y="9" width="9" height="61" class="q"/><rect x="52" y="31" width="9" height="39" class="q"/><rect x="65" y="0" width="9" height="70" fill="#f3bd58"/>
    <rect x="78" y="26" width="9" height="44" class="q"/><rect x="91" y="38" width="9" height="32" class="q"/><rect x="104" y="18" width="9" height="52" class="q"/><rect x="117" y="45" width="9" height="25" class="q"/><rect x="130" y="29" width="9" height="41" class="q"/><rect x="143" y="35" width="9" height="35" class="q"/>
  </g>
  <text x="865" y="746" class="small">SHOW A 64-BAR Q-VALUE PLOT — NOT A LITERAL Q-TABLE</text>

  <text x="800" y="850" class="sub" text-anchor="middle">A fair comparison uses identical days, seeds, reward, baselines, and deterministic validation.</text>
</svg>
