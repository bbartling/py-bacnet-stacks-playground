[package]
name = "lakeside-heating-dsm"
version = "0.1.0"
edition = "2021"
description = "Lakeside heating DSM spreadsheet walk — egui + ONNX (E+ farm ML)"
publish = false

[dependencies]
eframe = { version = "0.31", default-features = true, features = ["default_fonts"] }
egui = "0.31"
egui_plot = "0.31"
ort = { version = "2.0.0-rc.10", features = ["ndarray"] }
ndarray = "0.16"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
csv = "1.3"
rfd = "0.15"

[profile.release]
lto = true
codegen-units = 1
