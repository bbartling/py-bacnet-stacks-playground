<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>diy‑bas – React UI</title>
  <!--
    This HTML file replaces the original vanilla JS dashboard with a simple React
    application. React and ReactDOM are loaded from unpkg and our JSX is
    transpiled on the fly by Babel at runtime. In a production deployment you
    would normally precompile the frontend using a bundler like Vite or
    Create‑React‑App. However, the network sandbox limits downloading npm
    packages, so we use the UMD builds instead. The colours and layout are
    based off of the provided bas_schedule_widget prototype.
  -->
  <style>
    :root {
      /* colour palette inspired by the schedule widget */
      --bg: #f3f6fb;
      --panel: #ffffff;
      --line: #d9e2ef;
      --text: #1f2937;
      --muted: #6b7280;
      --accent: #2563eb;
      --accent-dark: #1d4ed8;
      --block: #60a5fa;
      --block-dark: #1e40af;
      --danger: #dc2626;
      --green: #16a34a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    /* navigation bar */
    nav {
      display: flex;
      gap: 12px;
      background: var(--panel);
      border-bottom: 1px solid var(--line);
      padding: 10px 16px;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    nav button {
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 8px;
      padding: 6px 12px;
      cursor: pointer;
      color: var(--text);
      font-weight: 600;
    }
    nav button.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    nav button:hover { background: #f8fbff; }
    /* container for page content */
    .page { padding: 16px; }
    .schedule-wrap { display: grid; grid-template-columns: 76px 1fr; overflow: hidden; }
    .time-header { height: 42px; border-bottom: 1px solid var(--line); background: #f8fafc; }
    .time-scale {
      display: grid; grid-template-columns: repeat(24, 1fr); height: 42px; border-bottom: 1px solid var(--line); background: #f8fafc;
    }
    .time-cell { font-size: 11px; color: var(--muted); padding-top: 13px; border-left: 1px solid var(--line); text-align: center; }
    .day-label {
      height: 74px; border-bottom: 1px solid var(--line); padding: 13px 8px; background: #fff; font-weight: 750; position: relative;
    }
    .day-label small { display: block; color: var(--muted); font-weight: 500; margin-top: 3px; }
    .day-row {
      position: relative; height: 74px; border-bottom: 1px solid var(--line); background: #fff;
      background-image: linear-gradient(to right, rgba(217,226,239,.95) 1px, transparent 1px), linear-gradient(to right, rgba(217,226,239,.45) 1px, transparent 1px);
      background-size: calc(100% / 24) 100%, calc(100% / 96) 100%;
    }
    .day-row:hover { background-color: #fbfdff; }
    .block {
      position: absolute; top: 16px; height: 42px; border-radius: 11px; background: linear-gradient(180deg, #93c5fd, #3b82f6);
      border: 1px solid #2563eb; box-shadow: 0 8px 18px rgba(37, 99, 235, .25); cursor: grab; color: white;
      display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 800; user-select: none;
    }
    .block:active { cursor: grabbing; }
    .handle {
      position: absolute; top: 0; width: 12px; height: 100%; cursor: ew-resize; display: flex; align-items: center; justify-content: center;
    }
    .handle.left { left: 0; }
    .handle.right { right: 0; }
    .handle::after { content: ''; width: 3px; height: 22px; border-radius: 2px; background: rgba(255,255,255,.75); }
    .context-menu {
      position: fixed; z-index: 20; background: #fff; border: 1px solid var(--line); border-radius: 12px;
      box-shadow: 0 20px 35px rgba(15, 23, 42, .17); overflow: hidden; min-width: 210px;
    }
    .context-menu button { display: block; width: 100%; text-align: left; border: 0; border-radius: 0; padding: 11px 13px; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div id="root"></div>
  <!-- React and Babel via CDN for in‑browser JSX compilation -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel" data-presets="react,typescript">
    // ---------------------------------------------------------------------
    // React + TypeScript Single Page Application
    //
    // This script replaces the vanilla JS dashboard with a fully fledged
    // TypeScript React application. It implements navigation, schedule
    // editing, devices, points, discovery, alarms, notifications, docker logs,
    // wiresheet, dashboard builder and user management pages. Role‑based
    // access control hides write actions when the logged in user is read only.

    const { useState, useEffect, useContext, createContext } = React;

    // ---------------------------------------------------------------------
    // Weekly Schedule Widget
    //
    // The schedule widget allows the user to define weekly occupancy windows
    // by clicking, dragging and resizing blocks on a seven‑day grid. This
    // implementation mirrors the functionality of the original vanilla JS
    // schedule editor and uses the same CSS classes for styling. The widget
    // maintains its own internal state and could be extended to persist
    // schedules via API calls.

    interface Block { start: number; end: number; }
    type Schedule = { [day: string]: Block[] };
    const DAYS = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
    const SNAP = 15; // minutes snap interval
    const MIN_DURATION = 15;
    function clamp(v:number, min:number, max:number) { return Math.max(min, Math.min(max, v)); }
    function snapTo(mins:number) { return Math.round(mins / SNAP) * SNAP; }
    function fmtTime(mins:number) {
      const h24 = Math.floor(mins / 60) % 24;
      const m = mins % 60;
      const suffix = h24 >= 12 ? 'PM' : 'AM';
      const h = h24 % 12 || 12;
      return `${h}:${String(m).padStart(2,'0')} ${suffix}`;
    }
    function minutesFromX(clientX:number, rect:DOMRect) {
      return clamp(snapTo(((clientX - rect.left) / rect.width) * 1440), 0, 1440);
    }
    function normalizeBlocks(blocks: Block[]): Block[] {
      return [...blocks].filter(b => b.end - b.start >= MIN_DURATION).sort((a,b) => a.start - b.start);
    }
    function ScheduleWidget({ readOnly = false }: { readOnly?: boolean }) {
      const DEFAULT: Schedule = {
        Monday: [{ start: 420, end: 1020 }],
        Tuesday: [{ start: 420, end: 1020 }],
        Wednesday: [{ start: 420, end: 1020 }],
        Thursday: [{ start: 420, end: 1020 }],
        Friday: [{ start: 420, end: 1020 }],
        Saturday: [],
        Sunday: []
      };
      const [schedule,setSchedule] = useState<Schedule>(DEFAULT);
      const [clipboard,setClipboard] = useState<Block[] | null>(null);
      const [menu,setMenu] = useState<{ x:number; y:number; day:string; idx:number | null } | null>(null);
      const rowRefs = React.useRef<Record<string, HTMLDivElement | null>>({});
      useEffect(() => {
        const close = () => setMenu(null);
        window.addEventListener('click', close);
        return () => { window.removeEventListener('click', close); };
      }, []);
      function setDay(day:string, blocks:Block[]) {
        if (readOnly) return;
        setSchedule(prev => ({...prev, [day]: normalizeBlocks(blocks)}));
      }
      function addBlock(day:string, start:number = 480, end:number = 1020) {
        if (readOnly) return;
        setDay(day, [...schedule[day], {start,end}]);
      }
      function removeBlock(day:string, idx:number) {
        if (readOnly) return;
        setDay(day, schedule[day].filter((_,i) => i !== idx));
      }
      function copyDay(day:string) { setClipboard(schedule[day].map(b => ({...b}))); }
      function pasteDay(day:string) { if (clipboard && !readOnly) setDay(day, clipboard.map(b => ({...b}))); }
      function startPointer(day:string, idx:number, mode:string, e:any) {
        if (readOnly) return;
        e.stopPropagation(); e.preventDefault();
        const rect = rowRefs.current[day]!.getBoundingClientRect();
        const original = schedule[day][idx];
        const startMin = minutesFromX(e.clientX, rect);
        const move = (ev:any) => {
          const blocks = schedule[day].map(b => ({...b}));
          const next = {...original};
          if (mode === 'move') {
            const delta = minutesFromX(ev.clientX, rect) - startMin;
            const dur = original.end - original.start;
            next.start = clamp(snapTo(original.start + delta), 0, 1440 - dur);
            next.end = next.start + dur;
          } else if (mode === 'left') {
            next.start = clamp(minutesFromX(ev.clientX, rect), 0, original.end - MIN_DURATION);
          } else if (mode === 'right') {
            next.end = clamp(minutesFromX(ev.clientX, rect), original.start + MIN_DURATION, 1440);
          }
          blocks[idx] = next;
          setSchedule(prev => ({...prev, [day]: normalizeBlocks(blocks)}));
        };
        const up = () => {
          window.removeEventListener('pointermove', move);
          window.removeEventListener('pointerup', up);
        };
        window.addEventListener('pointermove', move);
        window.addEventListener('pointerup', up);
      }
      function onRowDoubleClick(day:string, e:any) {
        if (readOnly) return;
        const rect = rowRefs.current[day]!.getBoundingClientRect();
        const start = clamp(minutesFromX(e.clientX, rect), 0, 1380);
        addBlock(day, start, clamp(start + 120, 0, 1440));
      }
      function onContextMenu(e:any, day:string, idx:number | null = null) {
        e.preventDefault(); e.stopPropagation();
        if (readOnly) return; // no context menu when read‑only
        setMenu({ x: e.clientX, y: e.clientY, day, idx });
      }
      return (
        <div>
          <div className="schedule-wrap">
            <div className="time-header"></div>
            <div className="time-scale">
              {Array.from({length:24}).map((_,i) => (
                <div className="time-cell" key={i}>{i % 12 === 0 ? 12 : i % 12}{i < 12 ? 'a' : 'p'}</div>
              ))}
            </div>
            {DAYS.map(day => (
              <React.Fragment key={day}>
                <div className="day-label" onContextMenu={(e) => onContextMenu(e, day)}>
                  {day}
                  <small>{schedule[day].length ? `${schedule[day].length} block${schedule[day].length > 1 ? 's' : ''}` : 'no blocks'}</small>
                </div>
                <div
                  className="day-row"
                  ref={el => { rowRefs.current[day] = el; }}
                  onDoubleClick={(e) => onRowDoubleClick(day, e)}
                  onContextMenu={(e) => onContextMenu(e, day)}
                >
                  {schedule[day].map((block, idx) => {
                    const widthPercent = ((block.end - block.start) / 1440) * 100;
                    const leftPercent = (block.start / 1440) * 100;
                    return (
                      <div
                        key={idx}
                        className="block"
                        style={{ width: `${widthPercent}%`, left: `${leftPercent}%` }}
                        onPointerDown={(e) => startPointer(day, idx, 'move', e)}
                        onContextMenu={(e) => onContextMenu(e, day, idx)}
                      >
                        {fmtTime(block.start)}–{fmtTime(block.end)}
                        <div className="handle left" onPointerDown={(e) => startPointer(day, idx, 'left', e)}></div>
                        <div className="handle right" onPointerDown={(e) => startPointer(day, idx, 'right', e)}></div>
                      </div>
                    );
                  })}
                </div>
              </React.Fragment>
            ))}
          </div>
          {/* Context menu for schedule */}
          {menu && (
            <div className="context-menu" style={{ left: menu.x, top: menu.y }}>
              {menu.idx === null ? (
                <>
                  <button onClick={() => { addBlock(menu.day); setMenu(null); }}>Add block</button>
                  <button onClick={() => { copyDay(menu.day); setMenu(null); }}>Copy day</button>
                  <button onClick={() => { pasteDay(menu.day); setMenu(null); }} disabled={!clipboard}>Paste day</button>
                </>
              ) : (
                <>
                  <button onClick={() => { removeBlock(menu.day, menu.idx!); setMenu(null); }}>Delete block</button>
                </>
              )}
            </div>
          )}
        </div>
      );
    }

    // Types for our API responses and user context
    /** User payload returned from /api/auth/me */
    interface User { username: string; role: string; basRole: string; readOnly: boolean; isSuperuser: boolean; mustChangePassword: boolean; }
    interface Device { deviceInstance: number; label: string; status: string; offline: boolean; inAlarm?: boolean; note?: string; }
    interface Point {
      pointId: string;
      deviceInstance: number;
      label?: string;
      objectIdentifier: string;
      propertyIdentifier?: string;
      commandable: boolean;
      value?: any;
      valueState?: string;
      inAlarm?: boolean;
      deviceOfflineAlarm?: boolean;
      disabled?: boolean;
      overridden?: boolean;
      fault?: boolean;
      lastUpdated?: string;
      pollingEnabled?: boolean;
      intervalSec?: number;
    }
    interface AlarmEvent { pointId: string; message: string; state: string; kind: string; ts: number; valueAtOpen: any; triggeredAt: number; }

    // Contexts for API base URL and current user
    const ApiContext = createContext<string>('/api');
    const UserContext = createContext<{ user: User | null; setUser: (u: User | null) => void }>({ user: null, setUser: () => {} });

    // Generic hook to fetch JSON from the API base. Automatically tracks
    // loading and error states and updates when dependencies change.
    function useFetchJson<T>(url: string, deps: any[] = [], opts: RequestInit = {}): { data: T | null; error: any; loading: boolean } {
      const base = useContext(ApiContext);
      const [state, setState] = useState<{ data: T | null; error: any; loading: boolean }>({ data: null, error: null, loading: true });
      useEffect(() => {
        let canceled = false;
        setState({ data: null, error: null, loading: true });
        fetch(base + url, opts)
          .then(async (res) => {
            if (!res.ok) throw new Error(`${res.status}`);
            const json = await res.json();
            if (!canceled) setState({ data: json as any, error: null, loading: false });
          })
          .catch((err) => {
            if (!canceled) setState({ data: null, error: err, loading: false });
          });
        return () => {
          canceled = true;
        };
      }, deps);
      return state;
    }

    // Define navigation labels and route lists
    const NAV_LABELS: Record<string, string> = {
      overview: 'Overview',
      trends: 'Trends',
      alarms: 'Alarms',
      notifications: 'Notifications',
      schedule: 'Schedule',
      dockerlogs: 'Docker logs',
      discovery: 'Discovery',
      devices: 'Devices',
      points: 'Points',
      wiresheet: 'Wire sheet',
      builder: 'Dashboard builder',
      users: 'Users',
      logicflow: 'Logic Flow',
      diagnostics: 'Diagnostics',
    };
    const ALL_ROUTES = ['overview', 'trends', 'alarms', 'notifications', 'schedule', 'dockerlogs', 'discovery', 'devices', 'points', 'wiresheet', 'builder', 'users', 'logicflow', 'diagnostics'];

    // Determine which navigation items are visible to the user based on roles
    function navRoutesForUser(user: User | null): string[] {
      /*
       * Determine which top level navigation items should be visible for the
       * logged in user. System integrators (superusers) see everything. For
       * other roles we default to a minimal set of read‑only pages and
       * selectively enable interactive BAS features. Read‑only users do not
       * see schedule or points, since those pages allow writing to the BACnet
       * server. Write‑enabled users (readOnly === false) can see the
       * schedule, points and notifications pages. Maintenance users also
       * gain access to docker logs. Operators see only the overview,
       * devices, alarms and trends pages.
       */
      if (!user) return [];
      // Integrators get full access
      if (user.role === 'system_integrator') return ALL_ROUTES.slice();
      const routes: string[] = ['overview', 'devices', 'alarms', 'trends'];
      // Diagnostics page is available to all authenticated users
      routes.push('diagnostics');
      // Write‑enabled users can schedule and control points
      if (!user.readOnly) {
        routes.push('schedule', 'points', 'notifications');
      }
      // Maintenance role (basRole === 'maintenance') can view docker logs
      if (user.basRole === 'maintenance') {
        routes.push('dockerlogs');
      }
      return routes;
    }

    // Navigation bar component
    function NavBar({ route, setRoute }: { route: string; setRoute: (r: string) => void }) {
      const { user } = useContext(UserContext);
      const routes = navRoutesForUser(user);
      return (
        <nav>
          {routes.map((r) => (
            <button key={r} className={route === r ? 'active' : ''} onClick={() => setRoute(r)}>
              {NAV_LABELS[r] || r}
            </button>
          ))}
        </nav>
      );
    }

    // Login page prompts for credentials and updates user context on success
    function LoginPage() {
      const { setUser } = useContext(UserContext);
      const [username, setUsername] = useState('');
      const [password, setPassword] = useState('');
      const [error, setError] = useState('');
      const base = useContext(ApiContext);
      async function submit(e: React.FormEvent) {
        e.preventDefault();
        setError('');
        try {
          const res = await fetch(base + '/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password }),
          });
          const data = await res.json();
          if (!res.ok || !data.ok) {
            setError(data.error || 'Login failed');
            return;
          }
          setUser(data.user);
        } catch (err) {
          setError(String(err));
        }
      }
      return (
        <div className="page">
          <h2>Sign in</h2>
          <form onSubmit={submit}>
            <div style={{ marginBottom: '0.5rem' }}>
              <input placeholder="Username" value={username} onChange={(e) => setUsername(e.target.value)} style={{ padding: '0.5rem', width: '100%', maxWidth: '280px' }} />
            </div>
            <div style={{ marginBottom: '0.5rem' }}>
              <input type="password" placeholder="Password" value={password} onChange={(e) => setPassword(e.target.value)} style={{ padding: '0.5rem', width: '100%', maxWidth: '280px' }} />
            </div>
            {error && <div style={{ color: 'red', marginBottom: '0.5rem' }}>{error}</div>}
            <button type="submit" style={{ padding: '0.5rem 1rem', background: 'var(--accent)', color: '#fff', border: 'none', borderRadius: '5px' }}>Login</button>
          </form>
        </div>
      );
    }

    // Overview page shows site health from /api/health
    function OverviewPage() {
      const { data, error, loading } = useFetchJson<any>('/health', [], {});
      if (loading) return <div className="page"><p>Loading…</p></div>;
      if (error) return <div className="page"><p>Error loading health.</p></div>;
      return (
        <div className="page">
          <h2>Site overview</h2>
          <p><strong>App:</strong> {data.appTitle}</p>
          <p><strong>Site:</strong> {data.siteName}</p>
          <p><strong>BACnet server:</strong> {data.diy.status} ({data.diy.baseUrl})</p>
          <p><strong>Active alarms:</strong> {data.counts?.activeAlarms ?? 0}</p>
        </div>
      );
    }

    // Devices page lists discovered devices from /api/devices
    function DevicesPage() {
      const { data, error, loading } = useFetchJson<any>('/devices', [], {});
      const { user } = useContext(UserContext);
      if (loading) return <div className="page"><p>Loading devices…</p></div>;
      if (error) return <div className="page"><p>Error loading devices.</p></div>;
      const items: Device[] = data.items || [];
      return (
        <div className="page">
          <h2>Discovered devices</h2>
          <table className="dash-table">
            <thead><tr><th>Instance</th><th>Label</th><th>Status</th><th>Offline</th><th>Alarm</th></tr></thead>
            <tbody>
              {items.map((d, i) => {
                const cls: any = d.offline ? { backgroundColor: '#fefcbf' } : d.inAlarm ? { backgroundColor: '#fee2e2' } : {};
                return (
                  <tr key={i} style={cls}>
                    <td>{d.deviceInstance}</td>
                    <td>{d.label || '-'}</td>
                    <td>{d.status || '-'}</td>
                    <td>{d.offline ? 'yes' : 'no'}</td>
                    <td>{d.inAlarm ? 'yes' : 'no'}</td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      );
    }

    // Points tree component renders a collapsible tree grouped by device
    function PointsTree({ points, onAction, readOnly = false }: { points: Point[]; onAction: (action: string, point: Point) => void; readOnly?: boolean }) {
      const [menu, setMenu] = useState<{ x: number; y: number; point: Point } | null>(null);
      const group = new Map<number, Point[]>();
      (points || []).forEach((p) => {
        const di = p.deviceInstance;
        if (!group.has(di)) group.set(di, []);
        group.get(di)!.push(p);
      });
      function openMenu(e: React.MouseEvent, p: Point) {
        e.preventDefault();
        setMenu({ x: e.clientX, y: e.clientY, point: p });
      }
      function close() { setMenu(null); }
      return (
        <div style={{ position: 'relative' }}>
          {[...group.keys()].sort().map((di) => {
            const rows = group.get(di)!;
            return (
              <details key={di} open style={{ marginBottom: '0.5rem' }}>
                <summary style={{ fontWeight: 600, cursor: 'pointer' }}>Device {di} ({rows.length})</summary>
                <table className="dash-table" style={{ marginTop: '0.25rem' }}><thead><tr><th>Name</th><th>OID</th><th>Mode</th><th>Poll</th><th>Updated</th><th>Alarm</th><th>Value</th></tr></thead><tbody>
                  {rows.map((p, i) => {
                    const classes: any = {};
                    if (p.deviceOfflineAlarm) classes.backgroundColor = '#fefcbf';
                    else if (p.inAlarm) classes.backgroundColor = '#fee2e2';
                    else if (p.disabled) classes.backgroundColor = '#fde68a';
                    else if (p.overridden) classes.backgroundColor = '#ede9fe';
                    else if (p.fault) classes.backgroundColor = '#fecaca';
                    else if (p.valueState === 'stale') classes.backgroundColor = '#fafafa';
                    return (
                      <tr key={p.pointId || i} onContextMenu={(e) => openMenu(e, p)} style={classes}>
                        <td>{p.label || p.objectIdentifier || p.pointId}</td>
                        <td>{p.objectIdentifier}</td>
                        <td>{p.commandable ? 'commandable' : 'readonly'}</td>
                        <td>{p.pollingEnabled ? `${p.intervalSec || 30}s` : 'off'}</td>
                        <td>{p.lastUpdated || '-'}</td>
                        <td>{p.inAlarm ? 'ALM' : '-'}</td>
                        <td>{p.value ?? '—'}</td>
                      </tr>
                    );
                  })}
                </tbody></table>
              </details>
            );
          })}
          {menu && (
            <div className="context-menu" style={{ left: menu.x, top: menu.y }} onMouseLeave={() => setMenu(null)}>
              <button type="button" onClick={() => { onAction('poll-now', menu.point); close(); }}>Read now</button>
              {!readOnly && <button type="button" onClick={() => { onAction('poll-off', menu.point); close(); }}>Disable polling</button>}
              {!readOnly && <button type="button" onClick={() => { onAction('poll-30', menu.point); close(); }}>Poll 30s</button>}
              {menu.point.commandable && !readOnly && (
                <>
                  <hr className="points-menu-divider" /><div className="points-menu-head">Write BACnet</div>
                  <button type="button" onClick={() => { onAction('override', menu.point); close(); }}>Override @ priority 8…</button>
                  <button type="button" onClick={() => { onAction('set', menu.point); close(); }}>Set default…</button>
                  <button type="button" onClick={() => { onAction('release', menu.point); close(); }}>Release priority 8</button>
                </>
              )}
              {!readOnly && <hr className="points-menu-divider" />}
              {!readOnly && <button type="button" onClick={() => { onAction('delete', menu.point); close(); }}>Delete point</button>}
            </div>
          )}
        </div>
      );
    }

    // Points page fetches points and passes them to PointsTree with action handlers
    function PointsPage() {
      const { data, error, loading } = useFetchJson<any>('/points', [], {});
      const { user } = useContext(UserContext);
      if (loading) return <div className="page"><p>Loading points…</p></div>;
      if (error) return <div className="page"><p>Error loading points.</p></div>;
      const items: Point[] = data.items || [];
      async function handleAction(action: string, p: Point) {
        if (!user || user.readOnly) return;
        const base = '/api';
        if (action === 'delete') {
          await fetch(base + '/discovery/points/' + encodeURIComponent(String(p.pointId)), { method: 'DELETE' });
        } else if (action === 'poll-now') {
          await fetch(base + '/discovery/read/' + encodeURIComponent(String(p.pointId)), { method: 'POST' });
        } else if (action.startsWith('poll-')) {
          const seconds = action === 'poll-off' ? 0 : Number(action.split('-')[1]);
          await fetch(base + '/polling/config', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ pointId: p.pointId, enabled: seconds > 0, intervalSec: seconds }) });
        } else if (['override', 'set', 'release'].includes(action)) {
          let value: any = null;
          if (action !== 'release') {
            const input = prompt('Enter value:');
            if (input === null) return;
            value = input;
          }
          await fetch(base + '/point/write', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ pointId: p.pointId, action: action === 'override' ? 'override' : action === 'set' ? 'set' : 'release', value }) });
        }
      }
      return (
        <div className="page">
          <h2>Points</h2>
          <p style={{ fontSize: '0.875rem', color: 'var(--muted)' }}>Right‑click a point for polling and BACnet actions.</p>
          <PointsTree points={items} onAction={handleAction} readOnly={!!user?.readOnly} />
          {user?.readOnly && <p style={{ fontSize: '0.75rem', color: 'var(--muted)', marginTop: '.5rem' }}>Read‑only users cannot edit or control points.</p>}
        </div>
      );
    }

    // choose whether to view point statuses (down, disabled, overridden,
    // stale or fault) or device statuses (down or fault). The API uses
    // ``/status/points`` and ``/status/devices`` endpoints. All queries
    // leverage the ORM server side; no raw SQL is executed on the client.
    function DiagnosticsPage() {
      const [kind, setKind] = useState<'points' | 'devices'>('points');
      const [status, setStatus] = useState<string>('');
      const url = `/status/${kind}${status ? '?status=' + encodeURIComponent(status) : ''}`;
      const { data, error, loading } = useFetchJson<any>(url, [kind, status]);
      // Determine available statuses for the selected kind
      const pointStatuses = ['', 'down', 'disabled', 'overridden', 'stale', 'fault'];
      const deviceStatuses = ['', 'down', 'fault'];
      const statuses = kind === 'points' ? pointStatuses : deviceStatuses;

          {!loading && !error && items.length > 0 && (
            <table className="dash-table">
              <thead>
                {kind === 'points' ? (
                  <tr><th>Device</th><th>Point</th><th>Label</th><th>Down</th><th>Disabled</th><th>Overridden</th><th>Stale</th><th>Fault</th></tr>

              <tbody>

    // Main application component
    function App() {
      const [user, setUser] = useState<User | null>(null);
      const [route, setRoute] = useState('overview');
      const apiBase = '/api';
      // On mount fetch the current user
      useEffect(() => {
        fetch(apiBase + '/auth/me')
          .then(async (res) => res.json())
          .then((j) => {
            if (j.authenticated) setUser(j.user);
          })
          .catch(() => {});
      }, []);
      const ctx = { user, setUser };
      let page: JSX.Element = <OverviewPage />;
      if (!user) return <UserContext.Provider value={ctx}><LoginPage /></UserContext.Provider>;
      switch (route) {
        case 'overview': page = <OverviewPage />; break;
        case 'devices': page = <DevicesPage />; break;
        case 'points': page = <PointsPage />; break;
        case 'schedule': page = <SchedulePage />; break;
        case 'alarms': page = <AlarmsPage />; break;
        case 'notifications': page = <NotificationsPage />; break;
        case 'discovery': page = <DiscoveryPage />; break;
        case 'dockerlogs': page = <DockerLogsPage />; break;
        case 'wiresheet': page = <WiresheetPage />; break;
        case 'builder': page = <BuilderPage />; break;
        case 'logicflow': page = <FlowPage />; break;
        case 'diagnostics': page = <DiagnosticsPage />; break;
        case 'trends': page = <div className="page"><p>Trends chart not implemented in this prototype.</p></div>; break;
        case 'users': page = <UsersPage />; break;
        default: page = <OverviewPage />; break;
      }
      return (
        <UserContext.Provider value={ctx}>
          <ApiContext.Provider value={apiBase}>
            <NavBar route={route} setRoute={setRoute} />
            {page}
          </ApiContext.Provider>
        </UserContext.Provider>
      );
    }

    // Mount the React application
    const rootElement = document.getElementById('root')!;
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
</html>
