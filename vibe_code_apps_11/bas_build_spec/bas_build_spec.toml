# BAS build workspace manifest (orchestration; not bas_app runtime config).

[memory]
root = "memory"
bootstrap_file = "MEMORY.md"
bootstrap_max = 12000
daily_lookback = 2
domain_max = 2500

[cron]
jobs_file = "cron/jobs.json"
state_file = "cron/jobs-state.json"
runs_dir = "cron/runs"
reconcile_grace_sec = 7200

[paths]
# Relative to this bas_build_spec directory (vibe_code_apps_11/bas_build_spec → ../../bas_app = /home/ben/bas_app when bas_app stays at repo grandparent)
app_dir = "../../../bas_app"
