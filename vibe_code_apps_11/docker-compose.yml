services:
  caddy:
    image: caddy:2.8-alpine
    container_name: diy-bas-caddy
    depends_on:
      diy-bas:
        condition: service_healthy
    ports:
      - "${DIY_BAS_HTTP_PORT:-80}:80"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro

  diy-bacnet-server:
    profiles: ["with-bacnet-container"]
    build:
      context: ${DIY_BACNET_SERVER_DIR:-/home/ben/diy-bacnet-server}
    container_name: diy-bacnet-server
    command: python3 -u -m bacpypes_server.main --name ${DIY_BACNET_SERVER_NAME:-BACnetServer} --instance ${DIY_BACNET_SERVER_INSTANCE:-123456} --public
    environment:
      BACNET_RPC_API_KEY: ${BACNET_RPC_API_KEY:-}
    ports:
      - "8080:8080"
      - "47808:47808/udp"

  diy-bas:
    build:
      context: .
    container_name: diy-bas
    env_file:
      - .env
    environment:
      DIY_BAS_DATA_DIR: /app/data
      DIY_BACNET_URL: ${DIY_BACNET_URL:-http://host.docker.internal:8080}
      BACNET_RPC_API_KEY: ${BACNET_RPC_API_KEY:-}
      DIY_BACNET_SERVER_INSTANCE: ${DIY_BACNET_SERVER_INSTANCE:-123456}
      DIY_BAS_HIDE_GATEWAY_DEVICE: ${DIY_BAS_HIDE_GATEWAY_DEVICE:-true}
      PORT: 5050
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/app/data
      # Uncomment on the Pi (trusted network only) so the "Docker logs" tab can run `docker logs`:
      # - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5050/api/health', timeout=5)"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  # Optional TimescaleDB container for time series telemetry. When using the
  # ``timeseries`` database configuration in settings.py, you must run
  # this service (using docker-compose --profile with-timeseries). The
  # environment variables below should match the values supplied via
  # DIY_BAS_TIMESERIES_* variables. Expose port 5432 for TimescaleDB
  # client connections and persist data in a dedicated volume.
  timeseries-db:
    profiles: ["with-timeseries"]
    image: timescale/timescaledb:latest-pg14
    container_name: diy-bas-timeseries
    environment:
      POSTGRES_DB: ${DIY_BAS_TIMESERIES_NAME:-diy_timeseries}
      POSTGRES_USER: ${DIY_BAS_TIMESERIES_USER:-diy}
      POSTGRES_PASSWORD: ${DIY_BAS_TIMESERIES_PASSWORD:-diy}
    ports:
      - "5432:5432"
    volumes:
      - timeseries-data:/var/lib/postgresql/data

volumes:
  timeseries-data:
    driver: local
