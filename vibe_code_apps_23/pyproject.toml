[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vibe23-residential-dsm"
version = "0.3.0"
description = "Residential heat-pump EnergyPlus DSM lab: DR demo, thermostat grid search, battery co-optimization"
requires-python = ">=3.12"
dependencies = ["matplotlib>=3.9", "numpy>=2.0", "pandas>=2.2", "tzdata>=2024.1"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.12"]
compute = ["psutil>=5.9"]

[project.scripts]
vibe23 = "vibe23.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
