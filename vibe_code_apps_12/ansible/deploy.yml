---
# Deploy unified BACnet edge stack to Linux gateways over SSH (inventory IP).
#
#   ansible-playbook deploy.yml --limit bacnet_pi
#   ansible-playbook deploy.yml --limit <inventory_host>
#
# After BACnet discover + CSV commission:
#   ansible-playbook deploy.yml --limit bacnet_pi -e enable_bacnet_read_driver=true

- name: Deploy Vibe12 BACnet edge to Linux gateway
  hosts: pi_bcn
  gather_facts: true

  vars:
    edge_needs_aws_iot_certs: >-
      {{
        (enable_aws_iot | default(true) | bool)
        or (install_bacnet_read_unit | default(true) | bool)
        or (enable_bacnet_read_driver | default(false) | bool)
      }}
    bacnet_core_sync_files:
      - requirements.txt

  tasks:
    - name: Ensure application directory exists
      ansible.builtin.file:
        path: "{{ bacnet_app_remote_dir }}"
        state: directory
        mode: "0755"

    - name: Copy core application files (always)
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../{{ item }}"
        dest: "{{ bacnet_app_remote_dir }}/{{ item }}"
        mode: "0644"
      loop: "{{ bacnet_core_sync_files }}"

    - name: Sync edge_bacnet package (BACnet discover + read driver)
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../edge_bacnet/"
        dest: "{{ bacnet_app_remote_dir }}/edge_bacnet/"
        mode: "0644"
      notify:
        - Restart BACnet read driver

    - name: Stat commissioned points.csv on control machine
      ansible.builtin.stat:
        path: "{{ edge_backup_dir }}/{{ site_id }}/{{ building_id }}/points.csv"
      delegate_to: localhost
      become: false
      register: local_commission_csv

    - name: Push commissioned points.csv to edge (from repo backup)
      ansible.builtin.copy:
        src: "{{ edge_backup_dir }}/{{ site_id }}/{{ building_id }}/points.csv"
        dest: "{{ points_csv_path }}"
        mode: "0644"
      when: local_commission_csv.stat.exists | default(false)
      notify: Restart BACnet read driver

    - name: apt update (Debian / Ubuntu / Raspberry Pi OS)
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: "{{ apt_cache_valid_time | default(3600) }}"
      become: true

    - name: Install base Python packages (Debian / Raspberry Pi OS)
      ansible.builtin.apt:
        name:
          - python3
          - python3-venv
          - python3-pip
        state: present
      become: true

    - name: Install edge commissioning scripts
      ansible.builtin.copy:
        src: scripts/edge/
        dest: "{{ bacnet_app_remote_dir }}/scripts/edge/"
        mode: "0755"

    - name: Ensure jobs directory on edge
      ansible.builtin.file:
        path: "{{ bacnet_app_remote_dir }}/jobs"
        state: directory
        mode: "0755"

    - name: Install tcpdump for optional post-deploy BACnet capture
      ansible.builtin.apt:
        name: tcpdump
        state: present
      become: true
      when: enable_deploy_pcap | default(false) | bool

    - name: Ensure captures directory on edge
      ansible.builtin.file:
        path: "{{ deploy_pcap_path | dirname }}"
        state: directory
        mode: "0755"
      when: enable_deploy_pcap | default(false) | bool

    - name: Ensure scripts directory on edge
      ansible.builtin.file:
        path: "{{ bacnet_app_remote_dir }}/scripts"
        state: directory
        mode: "0755"
      when: enable_deploy_pcap | default(false) | bool

    - name: Install BACnet wire capture script
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../scripts/bacnet_tcpdump_once.sh"
        dest: "{{ bacnet_app_remote_dir }}/scripts/bacnet_tcpdump_once.sh"
        mode: "0755"
      when: enable_deploy_pcap | default(false) | bool

    - name: Create virtual environment
      ansible.builtin.command:
        argv:
          - python3
          - -m
          - venv
          - "{{ bacnet_app_remote_dir }}/.venv"
        creates: "{{ bacnet_app_remote_dir }}/.venv/bin/python"

    - name: Install Python dependencies into venv
      ansible.builtin.pip:
        requirements: "{{ bacnet_app_remote_dir }}/requirements.txt"
        virtualenv: "{{ bacnet_app_remote_dir }}/.venv"

    - name: Stat AWS IoT device certificate on control machine
      ansible.builtin.stat:
        path: "{{ aws_iot_certs_local_dir }}/{{ aws_iot_cert_filename }}"
      delegate_to: localhost
      become: false
      register: aws_iot_cert_local
      when: edge_needs_aws_iot_certs | bool

    - name: Stat AWS IoT private key on control machine
      ansible.builtin.stat:
        path: "{{ aws_iot_certs_local_dir }}/{{ aws_iot_key_filename }}"
      delegate_to: localhost
      become: false
      register: aws_iot_key_local
      when: edge_needs_aws_iot_certs | bool

    - name: Fail if AWS IoT certs missing on control machine
      ansible.builtin.fail:
        msg: >-
          AWS IoT cert/key not found under {{ aws_iot_certs_local_dir }}/.
          Run: cd vibe_code_apps_12 && ./ansible/prepare_aws_iot_certs.sh
      when:
        - edge_needs_aws_iot_certs | bool
        - not aws_iot_cert_local.stat.exists | default(false) or not aws_iot_key_local.stat.exists | default(false)

    - name: Ensure AWS IoT cert directory on Pi
      ansible.builtin.file:
        path: "{{ aws_iot_certs_remote_dir }}"
        state: directory
        mode: "0700"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
      when: edge_needs_aws_iot_certs | bool

    - name: Copy AWS IoT device certificate and private key to Pi
      ansible.builtin.copy:
        src: "{{ aws_iot_certs_local_dir }}/{{ item.name }}"
        dest: "{{ aws_iot_certs_remote_dir }}/{{ item.name }}"
        mode: "{{ item.mode }}"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
      loop:
        - { name: "{{ aws_iot_cert_filename }}", mode: "0644" }
        - { name: "{{ aws_iot_key_filename }}", mode: "0600" }
      when: edge_needs_aws_iot_certs | bool
      notify: Restart BACnet read driver

    - name: Install BACnet discover oneshot unit
      ansible.builtin.template:
        src: templates/vibe12-bacnet-discover.service.j2
        dest: /etc/systemd/system/vibe12-bacnet-discover.service
        mode: "0644"
      become: true
      when: install_bacnet_discover_unit | default(true) | bool

    - name: Install BACnet read driver unit
      ansible.builtin.template:
        src: templates/vibe12-bacnet-read.service.j2
        dest: /etc/systemd/system/vibe12-bacnet-read.service
        mode: "0644"
      become: true
      when: install_bacnet_read_unit | default(true) | bool
      notify: Restart BACnet read driver

    - name: Install commissioning agent env file
      ansible.builtin.template:
        src: templates/commissioning_agent.env.j2
        dest: "{{ bacnet_app_remote_dir }}/commissioning_agent.env"
        mode: "0600"
      when: enable_commissioning_web | default(false) | bool
      notify: Restart commissioning agent

    - name: Install commissioning HTTP agent unit
      ansible.builtin.template:
        src: templates/vibe12-commissioning-agent.service.j2
        dest: /etc/systemd/system/vibe12-commissioning-agent.service
        mode: "0644"
      become: true
      when: enable_commissioning_web | default(false) | bool
      notify: Restart commissioning agent

    - name: Enable and start commissioning HTTP agent
      ansible.builtin.systemd:
        name: vibe12-commissioning-agent
        enabled: true
        state: started
        daemon_reload: true
      become: true
      when: enable_commissioning_web | default(false) | bool

    - name: Enable BACnet read driver when commissioned
      ansible.builtin.systemd:
        name: vibe12-bacnet-read
        enabled: "{{ enable_bacnet_read_driver | default(false) | bool }}"
        state: "{{ 'started' if enable_bacnet_read_driver | default(false) | bool else 'stopped' }}"
        daemon_reload: true
      become: true
      when: install_bacnet_read_unit | default(true) | bool

    # --- Verify (BACnet edge) ---
    - name: Assert BACnet discover unit is installed
      tags: [verify]
      ansible.builtin.stat:
        path: /etc/systemd/system/vibe12-bacnet-discover.service
      register: discover_unit
      become: true
      when:
        - install_bacnet_discover_unit | default(true) | bool
        - run_deploy_verify | default(true) | bool

    - name: Fail if BACnet discover unit missing
      tags: [verify]
      ansible.builtin.assert:
        that: discover_unit.stat.exists
        fail_msg: "vibe12-bacnet-discover.service not installed"
      when:
        - discover_unit is defined
        - run_deploy_verify | default(true) | bool

    - name: Assert BACnet read driver unit is installed
      tags: [verify]
      ansible.builtin.stat:
        path: /etc/systemd/system/vibe12-bacnet-read.service
      register: read_unit
      become: true
      when:
        - install_bacnet_read_unit | default(true) | bool
        - run_deploy_verify | default(true) | bool

    - name: Stat AWS IoT cert files on Pi
      tags: [verify]
      ansible.builtin.stat:
        path: "{{ aws_iot_certs_remote_dir }}/{{ item }}"
      loop:
        - "{{ aws_iot_cert_filename }}"
        - "{{ aws_iot_key_filename }}"
      register: aws_iot_remote_certs
      when:
        - edge_needs_aws_iot_certs | bool
        - run_deploy_verify | default(true) | bool

    - name: Assert AWS IoT cert files exist on Pi
      tags: [verify]
      ansible.builtin.assert:
        that: item.stat.exists
        fail_msg: "Missing on Pi: {{ item.item }}"
      loop: "{{ aws_iot_remote_certs.results }}"
      loop_control:
        label: "{{ item.item }}"
      when:
        - edge_needs_aws_iot_certs | bool
        - aws_iot_remote_certs is defined
        - run_deploy_verify | default(true) | bool

    - name: BACnet read driver service state
      tags: [verify]
      ansible.builtin.command:
        argv:
          - systemctl
          - is-active
          - vibe12-bacnet-read
      register: bacnet_read_active
      changed_when: false
      failed_when: false
      become: true
      when:
        - enable_bacnet_read_driver | default(false) | bool
        - run_deploy_verify | default(true) | bool

    - name: Show BACnet read driver status
      tags: [verify]
      ansible.builtin.debug:
        msg: "vibe12-bacnet-read is {{ bacnet_read_active.stdout | default('unknown') }}"
      when: bacnet_read_active is defined

  handlers:
    - name: Restart BACnet read driver
      ansible.builtin.systemd:
        name: vibe12-bacnet-read
        state: restarted
        daemon_reload: true
        enabled: "{{ enable_bacnet_read_driver | default(false) | bool }}"
      become: true
      when:
        - install_bacnet_read_unit | default(true) | bool
        - enable_bacnet_read_driver | default(false) | bool

    - name: Restart commissioning agent
      ansible.builtin.systemd:
        name: vibe12-commissioning-agent
        state: restarted
        daemon_reload: true
      become: true
      when: enable_commissioning_web | default(false) | bool

- name: BACnet wire capture after deploy (overwrite bacnet.pcap)
  hosts: pi_bcn
  gather_facts: false

  tasks:
    - name: Wait for BACnet read driver before capture
      ansible.builtin.command:
        argv:
          - systemctl
          - is-active
          - vibe12-bacnet-read
      register: pcap_read_wait
      until: pcap_read_wait.rc == 0
      retries: "{{ ((deploy_pcap_wait_seconds | int) / 5) | int }}"
      delay: 5
      changed_when: false
      become: true
      when:
        - enable_deploy_pcap | default(false) | bool
        - enable_bacnet_read_driver | default(false) | bool
        - install_bacnet_read_unit | default(true) | bool

    - name: Settle before tcpdump (no BACnet systemd wait configured)
      ansible.builtin.pause:
        seconds: "{{ deploy_pcap_wait_seconds | int }}"
      when:
        - enable_deploy_pcap | default(false) | bool
        - not (enable_bacnet_read_driver | default(false) | bool)

    - name: Short settle before tcpdump
      ansible.builtin.pause:
        seconds: 5
      when: enable_deploy_pcap | default(false) | bool

    - name: Run bacnet_tcpdump_once.sh in background (overwrites prior pcap)
      ansible.builtin.command:
        argv:
          - "{{ bacnet_app_remote_dir }}/scripts/bacnet_tcpdump_once.sh"
          - "{{ deploy_pcap_path }}"
          - "{{ deploy_pcap_filter }}"
          - "{{ deploy_pcap_seconds | string }}"
      async: "{{ deploy_pcap_async_timeout | int }}"
      poll: 0
      become: true
      when: enable_deploy_pcap | default(false) | bool

    - name: Note capture path on edge
      ansible.builtin.debug:
        msg: >-
          BACnet capture started ({{ deploy_pcap_seconds }}s, filter: {{ deploy_pcap_filter }}).
          File: {{ deploy_pcap_path }} — scp when finished.
      when: enable_deploy_pcap | default(false) | bool
