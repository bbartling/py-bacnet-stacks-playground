---
# Deploy vibe_code_apps_12 (DS18B20 + BACnet) to Raspberry Pi.
#
# From this directory:
#   ansible-playbook deploy.yml
#
# Override bind / user without editing files:
#   ansible-playbook deploy.yml -e ansible_user=ben -e bacnet_bind_address=eth0
#
# One-off file copy without Ansible: ../ansible/scp_files.sh — see ../README.md

- name: Deploy BACnet DS18B20 temperature server to Raspberry Pi
  hosts: pi_bcn
  gather_facts: true

  vars:
    bacnet_sync_files:
      - temp_sensor_server.py
      - fault_demo_schedule.py
      - ds18b20_sensor.py
      - aws_iot_publisher.py
      - requirements.txt

  tasks:
    - name: Ensure application directory exists
      ansible.builtin.file:
        path: "{{ bacnet_app_remote_dir }}"
        state: directory
        mode: "0755"

    - name: Copy BACnet / DS18B20 application files
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../{{ item }}"
        dest: "{{ bacnet_app_remote_dir }}/{{ item }}"
        mode: "0644"
      loop: "{{ bacnet_sync_files }}"
      notify: Restart BACnet DS18B20 service

    - name: Install base Python packages (Debian / Raspberry Pi OS)
      ansible.builtin.apt:
        name:
          - python3
          - python3-venv
          - python3-pip
        state: present
        update_cache: true
        cache_valid_time: 86400
      become: true

    - name: Create virtual environment
      ansible.builtin.command:
        argv:
          - python3
          - -m
          - venv
          - "{{ bacnet_app_remote_dir }}/.venv"
        creates: "{{ bacnet_app_remote_dir }}/.venv/bin/python"

    - name: Install Python dependencies into venv
      ansible.builtin.pip:
        requirements: "{{ bacnet_app_remote_dir }}/requirements.txt"
        virtualenv: "{{ bacnet_app_remote_dir }}/.venv"

    - name: Stat AWS IoT device certificate on control machine
      ansible.builtin.stat:
        path: "{{ aws_iot_certs_local_dir }}/{{ aws_iot_cert_filename }}"
      delegate_to: localhost
      become: false
      register: aws_iot_cert_local
      when: enable_aws_iot | default(false) | bool

    - name: Stat AWS IoT private key on control machine
      ansible.builtin.stat:
        path: "{{ aws_iot_certs_local_dir }}/{{ aws_iot_key_filename }}"
      delegate_to: localhost
      become: false
      register: aws_iot_key_local
      when: enable_aws_iot | default(false) | bool

    - name: Fail if AWS IoT certs missing on control machine
      ansible.builtin.fail:
        msg: >-
          AWS IoT cert/key not found under {{ aws_iot_certs_local_dir }}/.
          Run: cd vibe_code_apps_12 && ./ansible/prepare_aws_iot_certs.sh
          (after unzipping connect_device_package.zip in aws_iot_core_test/).
      when:
        - enable_aws_iot | default(false) | bool
        - not aws_iot_cert_local.stat.exists | default(false) or not aws_iot_key_local.stat.exists | default(false)

    - name: Ensure AWS IoT cert directory on Pi
      ansible.builtin.file:
        path: "{{ aws_iot_certs_remote_dir }}"
        state: directory
        mode: "0700"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
      when: enable_aws_iot | default(false) | bool

    - name: Copy AWS IoT device certificate and private key to Pi
      ansible.builtin.copy:
        src: "{{ aws_iot_certs_local_dir }}/{{ item.name }}"
        dest: "{{ aws_iot_certs_remote_dir }}/{{ item.name }}"
        mode: "{{ item.mode }}"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
      loop:
        - { name: "{{ aws_iot_cert_filename }}", mode: "0644" }
        - { name: "{{ aws_iot_key_filename }}", mode: "0600" }
      when: enable_aws_iot | default(false) | bool
      notify: Restart BACnet DS18B20 service

    - name: Stat boot config paths for optional 1-Wire overlay
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /boot/firmware/config.txt
        - /boot/config.txt
      register: boot_cfg_stats

    - name: Enable 1-Wire on GPIO4 (DS18B20 DATA pin)
      ansible.builtin.lineinfile:
        path: "{{ item.item }}"
        regexp: '^#?\s*dtoverlay=w1-gpio'
        line: "dtoverlay=w1-gpio,gpio=4"
        create: false
      loop: "{{ boot_cfg_stats.results }}"
      become: true
      when:
        - enable_onewire_overlay | default(false) | bool
        - item.stat.exists | default(false)

    - name: Install systemd unit
      ansible.builtin.template:
        src: templates/bacnet-ds18b20.service.j2
        dest: /etc/systemd/system/bacnet-ds18b20.service
        mode: "0644"
      become: true
      when: install_systemd_unit | default(true) | bool
      notify: Restart BACnet DS18B20 service

    - name: Stat legacy RTD systemd unit (optional migration)
      ansible.builtin.stat:
        path: /etc/systemd/system/bacnet-rtd-temp.service
      register: legacy_rtd_unit
      when: install_systemd_unit | default(true) | bool

    - name: Disable legacy unit if unit file exists
      ansible.builtin.systemd:
        name: bacnet-rtd-temp
        enabled: false
        state: stopped
      become: true
      when:
        - install_systemd_unit | default(true) | bool
        - legacy_rtd_unit.stat.exists | default(false)

    - name: Enable BACnet DS18B20 service (unit file on disk)
      ansible.builtin.systemd:
        name: bacnet-ds18b20
        enabled: "{{ enable_and_start_service | default(true) | bool }}"
        daemon_reload: true
      become: true
      when: install_systemd_unit | default(true) | bool

    # Always restart after a deploy so new Python code is loaded (state: started
    # alone leaves an already-running process untouched — same as manual restart).
    - name: Restart BACnet DS18B20 service after deploy
      ansible.builtin.systemd:
        name: bacnet-ds18b20
        state: restarted
        daemon_reload: true
      become: true
      when:
        - install_systemd_unit | default(true) | bool
        - enable_and_start_service | default(true) | bool

    - name: Wait briefly for the service to settle
      ansible.builtin.pause:
        seconds: 3
      tags: [verify]
      when:
        - install_systemd_unit | default(true) | bool
        - enable_and_start_service | default(true) | bool
        - run_deploy_verify | default(true) | bool

    - name: Assert bacnet-ds18b20 is active
      tags: [verify]
      ansible.builtin.command:
        argv:
          - systemctl
          - is-active
          - bacnet-ds18b20
      register: bacnet_svc_active
      changed_when: false
      failed_when: bacnet_svc_active.stdout != "active"
      become: true
      when:
        - install_systemd_unit | default(true) | bool
        - enable_and_start_service | default(true) | bool
        - run_deploy_verify | default(true) | bool

    - name: Recent bacnet-ds18b20 journal (look for BACnet + temperature publishes)
      tags: [verify]
      ansible.builtin.command:
        argv:
          - journalctl
          - -u
          - bacnet-ds18b20
          - -n
          - "60"
          - --no-pager
      register: bacnet_journal
      changed_when: false
      become: true
      when:
        - install_systemd_unit | default(true) | bool
        - enable_and_start_service | default(true) | bool
        - run_deploy_verify | default(true) | bool

    - name: Show journal excerpt
      tags: [verify]
      ansible.builtin.debug:
        msg: "{{ bacnet_journal.stdout_lines }}"
      when:
        - bacnet_journal is defined
        - bacnet_journal.stdout_lines is defined

    - name: Stat AWS IoT cert files on Pi
      tags: [verify]
      ansible.builtin.stat:
        path: "{{ aws_iot_certs_remote_dir }}/{{ item }}"
      loop:
        - "{{ aws_iot_cert_filename }}"
        - "{{ aws_iot_key_filename }}"
      register: aws_iot_remote_certs
      when: enable_aws_iot | default(false) | bool

    - name: Assert AWS IoT cert files exist on Pi
      tags: [verify]
      ansible.builtin.assert:
        that: item.stat.exists
        fail_msg: "Missing on Pi: {{ item.item }}"
      loop: "{{ aws_iot_remote_certs.results }}"
      loop_control:
        label: "{{ item.item }}"
      when:
        - enable_aws_iot | default(false) | bool
        - aws_iot_remote_certs is defined

    - name: Show systemd ExecStart (confirm --aws-iot when enabled)
      tags: [verify]
      ansible.builtin.command:
        argv:
          - systemctl
          - show
          - bacnet-ds18b20
          - --property=ExecStart
      register: bacnet_exec_start
      changed_when: false
      become: true
      when:
        - install_systemd_unit | default(true) | bool
        - enable_and_start_service | default(true) | bool

    - name: Display ExecStart
      tags: [verify]
      ansible.builtin.debug:
        msg: "{{ bacnet_exec_start.stdout }}"
      when: bacnet_exec_start is defined

    - name: Sample first DS18B20 sysfs w1_slave
      tags: [verify]
      ansible.builtin.shell: |
        set -eu
        d="$(ls -d /sys/bus/w1/devices/28-* 2>/dev/null | head -n1 || true)"
        if [ -n "${d:-}" ] && [ -r "$d/w1_slave" ]; then cat "$d/w1_slave"
        else echo "No readable /sys/bus/w1/devices/28-*/w1_slave (enable 1-Wire, reboot)."
        fi
      args:
        executable: /bin/bash
      register: w1_sample
      changed_when: false
      when: run_deploy_verify | default(true) | bool

    - name: Show w1_slave sample (kernel confirms sensor responds)
      tags: [verify]
      ansible.builtin.debug:
        msg: "{{ w1_sample.stdout_lines }}"
      when:
        - w1_sample is defined
        - w1_sample.stdout_lines is defined

  handlers:
    - name: Restart BACnet DS18B20 service
      ansible.builtin.systemd:
        name: bacnet-ds18b20
        state: restarted
        daemon_reload: true
        enabled: "{{ enable_and_start_service | default(true) | bool }}"
      become: true
      when:
        - install_systemd_unit | default(true) | bool
        - enable_and_start_service | default(true) | bool
