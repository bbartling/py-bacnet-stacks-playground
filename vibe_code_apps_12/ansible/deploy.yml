---
# Deploy vibe_code_apps_12 (DS18B20 + BACnet) to Raspberry Pi.
#
# From this directory:
#   ansible-playbook deploy.yml
#
# Override bind / user without editing files:
#   ansible-playbook deploy.yml -e ansible_user=ben -e bacnet_bind_address=eth0
#
# One-off file copy without Ansible: ../ansible/scp_files.sh — see ../README.md

- name: Deploy BACnet DS18B20 temperature server to Raspberry Pi
  hosts: pi_bcn
  gather_facts: true

  vars:
    bacnet_sync_files:
      - temp_sensor_server.py
      - ds18b20_sensor.py
      - requirements.txt

  tasks:
    - name: Ensure application directory exists
      ansible.builtin.file:
        path: "{{ bacnet_app_remote_dir }}"
        state: directory
        mode: "0755"

    - name: Copy BACnet / DS18B20 application files
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../{{ item }}"
        dest: "{{ bacnet_app_remote_dir }}/{{ item }}"
        mode: "0644"
      loop: "{{ bacnet_sync_files }}"

    - name: Install base Python packages (Debian / Raspberry Pi OS)
      ansible.builtin.apt:
        name:
          - python3
          - python3-venv
          - python3-pip
        state: present
        update_cache: true
        cache_valid_time: 86400
      become: true

    - name: Create virtual environment
      ansible.builtin.command:
        argv:
          - python3
          - -m
          - venv
          - "{{ bacnet_app_remote_dir }}/.venv"
        creates: "{{ bacnet_app_remote_dir }}/.venv/bin/python"

    - name: Install Python dependencies into venv
      ansible.builtin.pip:
        requirements: "{{ bacnet_app_remote_dir }}/requirements.txt"
        virtualenv: "{{ bacnet_app_remote_dir }}/.venv"

    - name: Stat boot config paths for optional 1-Wire overlay
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /boot/firmware/config.txt
        - /boot/config.txt
      register: boot_cfg_stats

    - name: Enable 1-Wire on GPIO4 (DS18B20 DATA pin)
      ansible.builtin.lineinfile:
        path: "{{ item.item }}"
        regexp: '^#?\s*dtoverlay=w1-gpio'
        line: "dtoverlay=w1-gpio,gpio=4"
        create: false
      loop: "{{ boot_cfg_stats.results }}"
      become: true
      when:
        - enable_onewire_overlay | default(false) | bool
        - item.stat.exists | default(false)

    - name: Install systemd unit
      ansible.builtin.template:
        src: templates/bacnet-ds18b20.service.j2
        dest: /etc/systemd/system/bacnet-ds18b20.service
        mode: "0644"
      become: true
      when: install_systemd_unit | default(true) | bool
      notify: Reload systemd

    - name: Stat legacy RTD systemd unit (optional migration)
      ansible.builtin.stat:
        path: /etc/systemd/system/bacnet-rtd-temp.service
      register: legacy_rtd_unit
      when: install_systemd_unit | default(true) | bool

    - name: Disable legacy unit if unit file exists
      ansible.builtin.systemd:
        name: bacnet-rtd-temp
        enabled: false
        state: stopped
      become: true
      when:
        - install_systemd_unit | default(true) | bool
        - legacy_rtd_unit.stat.exists | default(false)

    - name: Enable and start BACnet DS18B20 service
      ansible.builtin.systemd:
        name: bacnet-ds18b20
        enabled: "{{ enable_and_start_service | default(true) | bool }}"
        state: "{{ 'started' if enable_and_start_service | default(true) | bool else 'stopped' }}"
        daemon_reload: true
      become: true
      when: install_systemd_unit | default(true) | bool

    - name: Wait briefly for the service to settle
      ansible.builtin.pause:
        seconds: 3
      when:
        - install_systemd_unit | default(true) | bool
        - enable_and_start_service | default(true) | bool
        - run_deploy_verify | default(true) | bool

    - name: Assert bacnet-ds18b20 is active
      ansible.builtin.command:
        argv:
          - systemctl
          - is-active
          - bacnet-ds18b20
      register: bacnet_svc_active
      changed_when: false
      failed_when: bacnet_svc_active.stdout != "active"
      become: true
      when:
        - install_systemd_unit | default(true) | bool
        - enable_and_start_service | default(true) | bool
        - run_deploy_verify | default(true) | bool

    - name: Recent bacnet-ds18b20 journal (look for BACnet + temperature publishes)
      ansible.builtin.command:
        argv:
          - journalctl
          - -u
          - bacnet-ds18b20
          - -n
          - "60"
          - --no-pager
      register: bacnet_journal
      changed_when: false
      become: true
      when:
        - install_systemd_unit | default(true) | bool
        - enable_and_start_service | default(true) | bool
        - run_deploy_verify | default(true) | bool

    - name: Show journal excerpt
      ansible.builtin.debug:
        msg: "{{ bacnet_journal.stdout_lines }}"
      when:
        - bacnet_journal is defined
        - bacnet_journal.stdout_lines is defined

    - name: Sample first DS18B20 sysfs w1_slave
      ansible.builtin.shell: |
        set -eu
        d="$(ls -d /sys/bus/w1/devices/28-* 2>/dev/null | head -n1 || true)"
        if [ -n "${d:-}" ] && [ -r "$d/w1_slave" ]; then cat "$d/w1_slave"
        else echo "No readable /sys/bus/w1/devices/28-*/w1_slave (enable 1-Wire, reboot)."
        fi
      args:
        executable: /bin/bash
      register: w1_sample
      changed_when: false
      when: run_deploy_verify | default(true) | bool

    - name: Show w1_slave sample (kernel confirms sensor responds)
      ansible.builtin.debug:
        msg: "{{ w1_sample.stdout_lines }}"
      when:
        - w1_sample is defined
        - w1_sample.stdout_lines is defined

  handlers:
    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true
      become: true
