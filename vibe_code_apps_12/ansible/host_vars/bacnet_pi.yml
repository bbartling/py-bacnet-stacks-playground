---
# Boss Pi test bench — MS/TP bench box (device 5007) via BASRT-B router → MQTT (same stack as field gateways).

site_id: demo
building_id: bens-office

# BACnet edge (discover + RPM read driver)
bacnet_instance_id: 599999
bacnet_edge_bind_address: "{{ ansible_host }}/24:47809"
bacnet_edge_device_name: Vibe12Edge
bacnet_device_name: "{{ bacnet_edge_device_name }}"
bacnet_route_aware: true
bacnet_network: 1
bacnet_router_ip: 192.168.204.200
bacnet_mstp_net: 2000
bacnet_discover_timeout: 15
bacnet_discover_range_low: 5007
bacnet_discover_range_high: 5007
points_discovered_path: "{{ bacnet_app_remote_dir }}/points_discovered.csv"

# Commissioned scrape → AWS IoT (edge_backup/demo/bens-office/points.csv in repo)
enable_bacnet_read_driver: true
bacnet_read_interval: 60
bacnet_edge_client_id: basicPubSub

deploy_pcap_udp_ports:
  - 47809
