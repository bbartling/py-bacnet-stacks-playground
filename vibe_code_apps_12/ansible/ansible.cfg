[defaults]
inventory = inventory.yml
interpreter_python = auto_silent
retry_files_enabled = False

# Ansible 2.19+ defaults to ssh_askpass; password deploy (--ask-pass) needs sshpass.
[ssh_connection]
password_mechanism = sshpass
# Tailscale / long copy: keep SSH from going idle mid-playbook.
ssh_args = -o ServerAliveInterval=30 -o ServerAliveCountMax=6
