---
# Defaults for ALL Linux BACnet edge hosts (Pi or x86).
# Per-building overrides go in host_vars/<inventory_name>.yml — not here.

bacnet_app_remote_dir: "/home/{{ ansible_user }}/vibe_code_apps_12"

# Bind BACnet/IP to this host's inventory IP (override with eth0 in host_vars if needed)
bacnet_bind_address: "{{ ansible_host }}/24"
# Optional second BACnet/IP bind (e.g. :47809 when PiTemp uses default 47808 on same host)
bacnet_edge_bind_address: "{{ bacnet_bind_address }}"

# Local BACnet device on the gateway stack (must be UNIQUE per device on a shared BACnet LAN)
bacnet_instance_id: 3456788
bacnet_device_name: BACnetEdge

# ---------------------------------------------------------------------------
# BACnet edge (DEFAULT — every building gateway)
# Discover → edit points.csv → enable read driver. No GPIO.
# ---------------------------------------------------------------------------
install_bacnet_discover_unit: true
install_bacnet_read_unit: true
enable_bacnet_read_driver: false
bacnet_discover_range_low: 1
bacnet_discover_range_high: 3456799
bacnet_read_interval: 30
points_csv_path: "{{ bacnet_app_remote_dir }}/points.csv"
points_discovered_path: "{{ bacnet_app_remote_dir }}/points_discovered.csv"
# Repo backup: vibe_code_apps_12/commissioning/{site_id}/{building_id}/
commissioning_backup_dir: "{{ playbook_dir }}/../commissioning"

# Override site_id + building_id per host (host_vars). These are fallbacks only.
site_id: demo
building_id: pi

# ---------------------------------------------------------------------------
# AWS IoT Core — shared device cert on all edges (see files/aws_iot/README.txt)
# Each host MUST have a unique MQTT client ID (bacnet_edge_client_id below).
# MQTT topics differentiate buildings: vibe12/{site_id}/{building_id}/…
# ---------------------------------------------------------------------------
enable_aws_iot: true
aws_iot_endpoint: a2ab6ncd4xlhhr-ats.iot.us-east-2.amazonaws.com
# Unique per inventory hostname — required when many gateways share one IoT cert
bacnet_edge_client_id: "vibe12-{{ inventory_hostname }}"
aws_iot_cert_filename: vibe-code-app-12-temp-sensor.cert.pem
aws_iot_key_filename: vibe-code-app-12-temp-sensor.private.key
aws_iot_certs_local_dir: "{{ playbook_dir }}/files/aws_iot"
aws_iot_certs_remote_dir: "{{ bacnet_app_remote_dir }}/aws_iot_certs"

# ---------------------------------------------------------------------------
# DS18B20 / GPIO — OFF by default (boss Pi only; see host_vars/bacnet_pi.yml)
# ---------------------------------------------------------------------------
enable_ds18b20_gpio: false
enable_ds18b20_service: false
enable_onewire_overlay: false
bacnet_sample_interval: 2
aws_iot_publish_interval: 60
aws_iot_client_id: basicPubSub
aws_iot_topic: sdk/test/python
fault_demo_mode: false
server_extra_args: []

install_systemd_unit: "{{ enable_ds18b20_gpio }}"
enable_and_start_service: "{{ enable_ds18b20_service }}"

run_deploy_verify: true
