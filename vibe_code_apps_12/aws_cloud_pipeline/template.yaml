AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Vibe12 — BACnet MQTT (AWS IoT) → Lambda ingest → DynamoDB (TTL) →
  Function URL dashboard (React SPA) + scheduled FDD. Multi-site via vibe12/{site}/{building}/{system}/{point}/telemetry.

Parameters:
  IotRuleName:
    Type: String
    Default: vibe12_telemetry_ingest
    AllowedPattern: "^[a-zA-Z0-9_]+$"
    Description: IoT rule name — letters, numbers, underscores only (no hyphens)
  IotBatchRuleName:
    Type: String
    Default: vibe12_batch_ingest
    AllowedPattern: "^[a-zA-Z0-9_]+$"
    Description: IoT rule for batched poll-cycle telemetry (one Lambda per building per cycle)
  TtlDays:
    Type: Number
    Default: 7
    Description: DynamoDB TTL — rows auto-delete after this many days
  DeployRevision:
    Type: String
    Default: "3"
    Description: Bump on each deploy (e.g. date +%s) so CloudFormation updates Lambdas when code changed
  OpenFddVersion:
    Type: String
    Default: "3.0.1"
    Description: PyPI open-fdd pin (Arrow-only FDD runtime)
  IotTopicPrefix:
    Type: String
    Default: vibe12
    Description: MQTT prefix — vibe12/{site}/{building}/{system}/{point}/telemetry
  WebUsername:
    Type: String
    Default: engineer
    Description: Single consulting-engineer login (SPA + API)
  WebPassword:
    Type: String
    NoEcho: true
    Default: change-me-on-deploy
    Description: Web login password — change on first deploy
  AuthSecret:
    Type: String
    NoEcho: true
    Default: vibe12-replace-with-long-random-string
    Description: HMAC secret for session tokens (32+ chars recommended)
  IotEdgeThings:
    Type: String
    Default: "[]"
    Description: >
      JSON array of edge gateways for IoT Core connectivity poll, e.g.
      [{"site_id":"demo","building_id":"bens-office","thing_name":"bosspi","client_id":"basicPubSub","label":"Boss Pi"}]

Resources:
  TelemetryTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "vibe12-telemetry-${AWS::StackName}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: device_id
          AttributeType: S
        - AttributeName: ts_ms
          AttributeType: N
        - AttributeName: building_scope
          AttributeType: S
        - AttributeName: scope_sort
          AttributeType: S
      KeySchema:
        - AttributeName: device_id
          KeyType: HASH
        - AttributeName: ts_ms
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: BuildingScopeIndex
          KeySchema:
            - AttributeName: building_scope
              KeyType: HASH
            - AttributeName: scope_sort
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true

  IngestFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: IoT Rule — BACnet hierarchical telemetry → DynamoDB
      Runtime: python3.12
      Architectures:
        - x86_64
      Timeout: 30
      MemorySize: 128
      CodeUri: ingest_lambda/
      Handler: lambda_function.lambda_handler
      Environment:
        Variables:
          TABLE_NAME: !Ref TelemetryTable
          TTL_DAYS: !Ref TtlDays
          DEPLOY_REVISION: !Ref DeployRevision
          IOT_TOPIC_PREFIX: !Ref IotTopicPrefix
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref TelemetryTable

  IotIngestRule:
    Type: AWS::IoT::TopicRule
    Properties:
      RuleName: !Ref IotRuleName
      TopicRulePayload:
        AwsIotSqlVersion: "2016-03-23"
        Sql: !Sub "SELECT *, topic() AS mqtt_topic FROM '${IotTopicPrefix}/+/+/+/+/telemetry'"
        Actions:
          - Lambda:
              FunctionArn: !GetAtt IngestFunction.Arn

  IotBatchIngestRule:
    Type: AWS::IoT::TopicRule
    Properties:
      RuleName: !Ref IotBatchRuleName
      TopicRulePayload:
        AwsIotSqlVersion: "2016-03-23"
        Sql: !Sub "SELECT *, topic() AS mqtt_topic FROM '${IotTopicPrefix}/+/+/batch/telemetry'"
        Actions:
          - Lambda:
              FunctionArn: !GetAtt IngestFunction.Arn

  IotInvokeIngestPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref IngestFunction
      Action: lambda:InvokeFunction
      Principal: iot.amazonaws.com
      SourceArn: !Sub "arn:aws:iot:${AWS::Region}:${AWS::AccountId}:rule/${IotRuleName}"

  IotInvokeBatchIngestPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref IngestFunction
      Action: lambda:InvokeFunction
      Principal: iot.amazonaws.com
      SourceArn: !Sub "arn:aws:iot:${AWS::Region}:${AWS::AccountId}:rule/${IotBatchRuleName}"

  WebFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: Function URL — React SPA + /api JSON
      Runtime: python3.12
      Architectures:
        - x86_64
      Timeout: 120
      MemorySize: 1536
      CodeUri: web_lambda/
      Handler: lambda_function.lambda_handler
      Environment:
        Variables:
          TABLE_NAME: !Ref TelemetryTable
          OPEN_FDD_VERSION: !Ref OpenFddVersion
          DEFAULT_HOURS: "168"
          READINGS_LIMIT: "62000"
          CHART_RESPONSE_MAX: "5000"
          FDD_CHUNK_HOURS: "6"
          VIBE12_TEMP_UNIT: "imperial"
          CHART_CHUNKED_HOURS: "48"
          CHART_CHUNKED_SAMPLES: "8000"
          TEST_HOURS_DEFAULT: "2"
          DEPLOY_REVISION: !Ref DeployRevision
          VIBE12_TTL_SYNC_INTERVAL_SECONDS: "300"
          VIBE12_WEB_USER: !Ref WebUsername
          VIBE12_WEB_PASSWORD: !Ref WebPassword
          VIBE12_AUTH_SECRET: !Ref AuthSecret
          IOT_EDGE_THINGS: !Ref IotEdgeThings
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref TelemetryTable
        - Statement:
            - Effect: Allow
              Action:
                - iot:GetThingConnectivityData
                - iot:SearchIndex
                - iot:DescribeThing
              Resource: "*"
      FunctionUrlConfig:
        AuthType: NONE

  FddFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: !Sub "Scheduled FDD rules (rev ${DeployRevision})"
      Runtime: python3.12
      Architectures:
        - x86_64
      Timeout: 120
      MemorySize: 1024
      CodeUri: fdd_lambda/
      Handler: lambda_function.lambda_handler
      Environment:
        Variables:
          TABLE_NAME: !Ref TelemetryTable
          LOOKBACK_HOURS: "168"
          READINGS_LIMIT: "62000"
          FDD_CHUNK_HOURS: "6"
          DEPLOY_REVISION: !Ref DeployRevision
          VIBE12_TTL_SYNC_INTERVAL_SECONDS: "300"
          BRICK_FDD_HOURS: "24"
          OPEN_FDD_VERSION: !Ref OpenFddVersion
          OPEN_FDD_FDD_BACKEND: arrow
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref TelemetryTable
      Events:
        EveryFiveMinutes:
          Type: Schedule
          Properties:
            Schedule: rate(5 minutes)
            Description: BRICK-scoped FDD on DynamoDB telemetry per building
            Enabled: true

Outputs:
  TelemetryTableName:
    Description: DynamoDB table for BACnet / edge telemetry
    Value: !Ref TelemetryTable
  DashboardUrl:
    Description: Open in a browser — dashboard + Rule Lab
    Value: !GetAtt WebFunctionUrl.FunctionUrl
  MqttTopicPattern:
    Description: Publish BACnet telemetry to this pattern (replace segments per site/building/equipment/point)
    Value: !Sub "${IotTopicPrefix}/{site_id}/{building_id}/{system_id}/{point_id}/telemetry"
  MqttBatchTopicPattern:
    Description: Batched poll cycle — one message per building (recommended for large sites)
    Value: !Sub "${IotTopicPrefix}/{site_id}/{building_id}/batch/telemetry"
  DeployedIotRuleName:
    Value: !Ref IotRuleName
  DeployedIotBatchRuleName:
    Value: !Ref IotBatchRuleName
  FddFunctionArn:
    Description: FDD scheduled Lambda (every 5 min)
    Value: !GetAtt FddFunction.Arn
