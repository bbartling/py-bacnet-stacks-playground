AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Vibe Code App 12B — Pi MQTT (AWS IoT) → Lambda ingest → DynamoDB (TTL) →
  Lambda Function URL dashboard (HTML + Chart.js). Free-tier-friendly demo scale.

Parameters:
  IotTopic:
    Type: String
    Default: sdk/test/python
    Description: MQTT topic the Pi already publishes (see ansible/group_vars/pi_bcn.yml)
  IotRuleName:
    Type: String
    Default: vibe12_ds18b20_ingest
    AllowedPattern: "^[a-zA-Z0-9_]+$"
    Description: IoT rule name — letters, numbers, underscores only (no hyphens)
  DeviceId:
    Type: String
    Default: bosspi-ds18b20
  TtlDays:
    Type: Number
    Default: 7
    Description: DynamoDB TTL — rows auto-delete after this many days
  DeployRevision:
    Type: String
    Default: "2"
    Description: Bump on each deploy (e.g. date +%s) so CloudFormation updates Lambdas when code changed
  IotTopicPrefix:
    Type: String
    Default: vibe12
    Description: MQTT prefix for BACnet hierarchical topics (vibe12/site/building/system/point/telemetry)

Resources:
  TelemetryTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "vibe12-telemetry-${AWS::StackName}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: device_id
          AttributeType: S
        - AttributeName: ts_ms
          AttributeType: N
        - AttributeName: building_scope
          AttributeType: S
        - AttributeName: scope_sort
          AttributeType: S
      KeySchema:
        - AttributeName: device_id
          KeyType: HASH
        - AttributeName: ts_ms
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: BuildingScopeIndex
          KeySchema:
            - AttributeName: building_scope
              KeyType: HASH
            - AttributeName: scope_sort
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true

  IngestFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: IoT Rule action — write telemetry rows with TTL
      Runtime: python3.13
      Architectures:
        - x86_64
      Timeout: 30
      MemorySize: 128
      CodeUri: ingest_lambda/
      Handler: lambda_function.lambda_handler
      Environment:
        Variables:
          TABLE_NAME: !Ref TelemetryTable
          DEVICE_ID: !Ref DeviceId
          TTL_DAYS: !Ref TtlDays
          DEPLOY_REVISION: !Ref DeployRevision
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref TelemetryTable

  IotIngestRule:
    Type: AWS::IoT::TopicRule
    Properties:
      RuleName: !Ref IotRuleName
      TopicRulePayload:
        AwsIotSqlVersion: "2016-03-23"
        Sql: !Sub "SELECT *, topic() AS mqtt_topic FROM '${IotTopic}'"
        Actions:
          - Lambda:
              FunctionArn: !GetAtt IngestFunction.Arn

  IotIngestRuleBacnet:
    Type: AWS::IoT::TopicRule
    Properties:
      RuleName: !Sub "${IotRuleName}_bacnet"
      TopicRulePayload:
        AwsIotSqlVersion: "2016-03-23"
        Sql: !Sub "SELECT *, topic() AS mqtt_topic FROM '${IotTopicPrefix}/+/+/+/+/telemetry'"
        Actions:
          - Lambda:
              FunctionArn: !GetAtt IngestFunction.Arn

  IotInvokeIngestPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref IngestFunction
      Action: lambda:InvokeFunction
      Principal: iot.amazonaws.com
      SourceArn: !Sub "arn:aws:iot:${AWS::Region}:${AWS::AccountId}:rule/${IotRuleName}"

  IotInvokeIngestPermissionBacnet:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref IngestFunction
      Action: lambda:InvokeFunction
      Principal: iot.amazonaws.com
      SourceArn: !Sub "arn:aws:iot:${AWS::Region}:${AWS::AccountId}:rule/${IotRuleName}_bacnet"

  WebFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: Function URL — HTML dashboard and /api/readings JSON
      Runtime: python3.13
      Architectures:
        - x86_64
      Timeout: 120
      MemorySize: 1024
      CodeUri: web_lambda/
      Handler: lambda_function.lambda_handler
      Environment:
        Variables:
          TABLE_NAME: !Ref TelemetryTable
          DEVICE_ID: !Ref DeviceId
          DEFAULT_HOURS: "168"
          READINGS_LIMIT: "62000"
          CHART_RESPONSE_MAX: "5000"
          FDD_CHUNK_HOURS: "6"
          VIBE12_TEMP_UNIT: "imperial"
          CHART_CHUNKED_HOURS: "48"
          CHART_CHUNKED_SAMPLES: "8000"
          TEST_HOURS_DEFAULT: "2"
          DEPLOY_REVISION: !Ref DeployRevision
          VIBE12_TTL_SYNC_INTERVAL_SECONDS: "300"
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref TelemetryTable
      FunctionUrlConfig:
        AuthType: NONE

  FddFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: !Sub "Scheduled FDD rules zip Lambda (rev ${DeployRevision})"
      Runtime: python3.13
      Architectures:
        - x86_64
      Timeout: 120
      MemorySize: 512
      CodeUri: fdd_lambda/
      Handler: lambda_function.lambda_handler
      Environment:
        Variables:
          TABLE_NAME: !Ref TelemetryTable
          DEVICE_ID: !Ref DeviceId
          LOOKBACK_HOURS: "168"
          READINGS_LIMIT: "62000"
          FDD_CHUNK_HOURS: "6"
          DEPLOY_REVISION: !Ref DeployRevision
          VIBE12_TTL_SYNC_INTERVAL_SECONDS: "300"
          BRICK_FDD_HOURS: "24"
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref TelemetryTable
      Events:
        EveryFiveMinutes:
          Type: Schedule
          Properties:
            Schedule: rate(5 minutes)
            Description: Run FDD rules on recent DynamoDB telemetry
            Enabled: true

Outputs:
  TelemetryTableName:
    Description: DynamoDB table for DS18B20 readings
    Value: !Ref TelemetryTable
  DashboardUrl:
    Description: Open in a browser — chart + latest temperature
    Value: !GetAtt WebFunctionUrl.FunctionUrl
  IotTopic:
    Value: !Ref IotTopic
  DeployedIotRuleName:
    Value: !Ref IotRuleName
  FddFunctionArn:
    Description: FDD scheduled Lambda (every 5 min, zip — no Docker)
    Value: !GetAtt FddFunction.Arn
