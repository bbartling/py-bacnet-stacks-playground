name: vibe12 unit tests

on:
  push:
    paths:
      - "vibe_code_apps_12/**"
  pull_request:
    paths:
      - "vibe_code_apps_12/**"

jobs:
  unittest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vibe_code_apps_12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unittest
        run: python3 -m unittest discover -s tests -v
