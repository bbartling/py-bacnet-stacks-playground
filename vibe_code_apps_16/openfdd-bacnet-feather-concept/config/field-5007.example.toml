# Bonus: poll a real field temp sensor (device 5007) AND the local mini-device.
#
#   OPENFDD_FEATHER_CONCEPT_CONFIG=config/field-5007.example.toml cargo run --bin bacnet_app
#
# Adjust object_type / object_instance / host to match your controller.
# host = controller IP on the OT LAN; port defaults to 47808 for field devices.

[store]
dir = "data/feather_store"

[server]
enabled = true
instance = 599998
name = "OpenFDD-Feather-Concept"
port = 47809
nic = "enp3s0"
value_update_secs = 2
temp_object_instance = 1
temp_point_name = "demo-temp"

[poller]
interval_secs = 10

[[poller.points]]
enabled = true
device_instance = 599998
object_type = "analog-input"
object_instance = 1
point_name = "demo-temp"
units = "°F"

# Field device 5007 — enable when the sensor is on the wire
[[poller.points]]
enabled = true
device_instance = 5007
object_type = "analog-input"
object_instance = 1
point_name = "field-temp"
units = "°F"
host = "192.168.204.14"
port = 47808
