# =============================================================================
# openfdd-bacnet-feather-concept — site configuration
# =============================================================================
# Mini-device (Workbench / YABE on UDP 47808) — unchanged:
#   device 5000, AV:1 5007-duct-t-clone, BI:1 APP-FAULT
#
# Multi-device poller (VOLTTRON platform.driver–inspired):
#   each [[poller.devices]] is a "driver" with its own interval + phase offset
#   scheduler wakes on tick_ms, scrapes overdue devices (max_concurrent at a time)
# =============================================================================

[store]
dir = "data/feather_store"
file = "telemetry.feather"

[server]
enabled = true
instance = 5000
name = "openfdd-bacnet-feather-concept"
port = 47808
nic = "enp3s0"
address = "192.168.204.55"
broadcast = "192.168.204.255"
value_update_secs = 2
temp_object_instance = 1
temp_point_name = "5007-duct-t-clone"
clone_from_point = "DUCT-T"
status_object_instance = 1
status_point_name = "APP-FAULT"

# Open-Meteo outdoor weather → BACnet AVs (poll every 20 min; fallbacks on failure)
[weather]
enabled = true
city = "Madison Wisconsin"
interval_secs = 1200
fallback_temp_f = 70.0
fallback_humidity = 50.0
fallback_wind_mph = 0.0
temp_object_instance = 2
temp_point_name = "OA-WEATHER-T"
humidity_object_instance = 3
humidity_point_name = "OA-WEATHER-RH"
wind_object_instance = 4
wind_point_name = "OA-WEATHER-WIND"
dewpoint_object_instance = 5
dewpoint_point_name = "OA-WEATHER-DP"

[poller]
# Scheduler tick (ms) and max devices scraping in parallel
tick_ms = 250
max_concurrent = 2
# Default interval when a device omits interval_secs
interval_secs = 10
bind = "192.168.204.55"
broadcast = "192.168.204.255"

# -----------------------------------------------------------------------------
# BENS BENCH TEST BOX — MSTP behind BIP router (critical = APP-FAULT + clone)
# -----------------------------------------------------------------------------
[[poller.devices]]
name = "BENS-BENCH"
enabled = true
device_instance = 5007
host = "192.168.204.200"
port = 47808
mstp_network = 2000
mstp_mac = [7]
interval_secs = 10
offset_secs = 0
critical = true

[[poller.devices.points]]
object_type = "analog-input"
object_instance = 1168
point_name = "OA-H"
units = "%RH"

[[poller.devices.points]]
object_type = "analog-input"
object_instance = 1173
point_name = "OA-T"
units = "°F"

