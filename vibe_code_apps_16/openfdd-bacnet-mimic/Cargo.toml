[package]
name = "openfdd-bacnet-mimic"
version = "0.1.0"
edition = "2021"
description = "Minimal Open-FDD BACnet/IP server for bench testing (device 599999)"
publish = false
default-run = "openfdd-bacnet-mimic"

[lib]
name = "openfdd_bacnet_mimic"
path = "src/lib.rs"

[[bin]]
name = "openfdd-bacnet-mimic"
path = "src/bin/server.rs"

[[bin]]
name = "bacnet-probe"
path = "src/bin/probe.rs"

[dependencies]
bacnet-client = { path = "../../../rusty-bacnet/crates/bacnet-client" }
bacnet-encoding = { path = "../../../rusty-bacnet/crates/bacnet-encoding" }
bacnet-objects = { path = "../../../rusty-bacnet/crates/bacnet-objects" }
bacnet-server = { path = "../../../rusty-bacnet/crates/bacnet-server" }
bacnet-transport = { path = "../../../rusty-bacnet/crates/bacnet-transport" }
bacnet-types = { path = "../../../rusty-bacnet/crates/bacnet-types" }
clap = { version = "4", features = ["derive"] }
socket2 = { version = "0.6", features = ["all"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time", "net"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
