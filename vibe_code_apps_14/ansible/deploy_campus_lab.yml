---
# Flat campus lab — one UDP port per building (Trane / Reddit style).
#   cd vibe_code_apps_14/ansible && ./deploy.sh

- name: Sync lab tree and Python venv on all Pis
  hosts: campus_lab
  gather_facts: true

  tasks:
    - name: Install packages
      ansible.builtin.apt:
        name:
          - python3
          - python3-venv
          - python3-pip
          - rsync
          - tcpdump
        state: present
        update_cache: true
        cache_valid_time: 86400
      become: true

    - name: Ensure lab directory exists
      ansible.builtin.file:
        path: "{{ campus_lab_dir }}"
        state: directory
        mode: "0755"

    - name: Ensure lab directory owned by {{ ansible_user }}
      ansible.builtin.file:
        path: "{{ campus_lab_dir }}"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        recurse: true
      become: true

    - name: Rsync vibe_code_apps_14 to Pi
      ansible.builtin.shell: |
        set -euo pipefail
        src="{{ playbook_dir }}/../"
        dest="{{ ansible_user }}@{{ ansible_host }}:{{ campus_lab_dir }}/"
        opts=""
        {% for item in campus_sync_excludes %}
        opts="$opts --exclude {{ item }}"
        {% endfor %}
        sshpass -p "{{ ansible_ssh_pass }}" rsync -az --delete \
          -e "ssh -o StrictHostKeyChecking=no" $opts "$src" "$dest"
      delegate_to: localhost
      become: false
      when: not (skip_rsync | default(false) | bool)

    - name: Make scripts executable
      ansible.builtin.file:
        path: "{{ campus_lab_dir }}/scripts"
        mode: "0755"
        recurse: true

    - name: Create venv
      ansible.builtin.command:
        argv:
          - python3
          - -m
          - venv
          - "{{ campus_lab_dir }}/.venv"
        creates: "{{ campus_lab_dir }}/.venv/bin/python3"

    - name: Install requirements
      ansible.builtin.pip:
        requirements: "{{ campus_lab_dir }}/requirements.txt"
        virtualenv: "{{ campus_lab_dir }}/.venv"

- name: Deploy flat-campus BACnet buildings
  hosts: campus_lab
  gather_facts: false

  tasks:
    - name: Install systemd unit per building device
      ansible.builtin.template:
        src: templates/campus-bacnet-building.service.j2
        dest: "/etc/systemd/system/{{ item.unit }}.service"
        mode: "0644"
      loop: "{{ campus_buildings }}"
      loop_control:
        label: "{{ item.unit }}"
      become: true

    - name: Enable and start building BACnet services
      ansible.builtin.systemd:
        name: "{{ item.unit }}"
        enabled: true
        state: restarted
        daemon_reload: true
      loop: "{{ campus_buildings }}"
      loop_control:
        label: "{{ item.unit }}"
      become: true

- name: 60s BACnet capture (overwrite bacnet.pcap)
  hosts: campus_lab
  gather_facts: false

  tasks:
    - name: Run campus_tcpdump_once.sh in background
      ansible.builtin.command:
        argv:
          - "{{ campus_lab_dir }}/scripts/campus_tcpdump_once.sh"
          - "{{ campus_capture_path }}"
          - "{{ campus_tcpdump_filter }}"
      async: 75
      poll: 0

- name: Verify flat campus lab
  hosts: campus_lab
  gather_facts: false

  tasks:
    - name: Wait for BACnet services
      ansible.builtin.pause:
        seconds: 5

    - name: Check each building unit is active
      ansible.builtin.command:
        argv: ["systemctl", "is-active", "{{ item.unit }}"]
      loop: "{{ campus_buildings }}"
      register: svc
      changed_when: false
      failed_when: svc.stdout != "active"
      become: true

    - name: Show BACnet UDP listeners
      ansible.builtin.shell: |
        ss -ulnp | grep -E '47809|47810|47811|47819|47820|47821' || true
      register: ss_out
      changed_when: false

    - name: Print UDP sockets
      ansible.builtin.debug:
        msg: "{{ ss_out.stdout_lines }}"
