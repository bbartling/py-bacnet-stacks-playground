---
# Deploy campus BACnet lab to bensserver + building Pis.
#   cd vibe_code_apps_14/ansible && ./deploy.sh

- name: Sync lab tree and Python venv on all Pis
  hosts: campus_lab
  gather_facts: true

  tasks:
    - name: Install packages
      ansible.builtin.apt:
        name:
          - python3
          - python3-venv
          - python3-pip
          - rsync
          - tcpdump
        state: present
        update_cache: true
        cache_valid_time: 86400
      become: true

    - name: Ensure lab directory exists
      ansible.builtin.file:
        path: "{{ campus_lab_dir }}"
        state: directory
        mode: "0755"

    - name: Ensure lab directory owned by {{ ansible_user }}
      ansible.builtin.file:
        path: "{{ campus_lab_dir }}"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        recurse: true
      become: true

    - name: Rsync vibe_code_apps_14 to Pi
      ansible.builtin.shell: |
        set -euo pipefail
        src="{{ playbook_dir }}/../"
        dest="{{ ansible_user }}@{{ ansible_host }}:{{ campus_lab_dir }}/"
        opts=""
        {% for item in campus_sync_excludes %}
        opts="$opts --exclude {{ item }}"
        {% endfor %}
        sshpass -p "{{ ansible_ssh_pass }}" rsync -az --delete \
          -e "ssh -o StrictHostKeyChecking=no" $opts "$src" "$dest"
      delegate_to: localhost
      become: false
      when: not (skip_rsync | default(false) | bool)

    - name: Make scripts executable
      ansible.builtin.file:
        path: "{{ campus_lab_dir }}/scripts"
        mode: "0755"
        recurse: true

    - name: Create venv
      ansible.builtin.command:
        argv:
          - python3
          - -m
          - venv
          - "{{ campus_lab_dir }}/.venv"
        creates: "{{ campus_lab_dir }}/.venv/bin/python3"

    - name: Install requirements
      ansible.builtin.pip:
        requirements: "{{ campus_lab_dir }}/requirements.txt"
        virtualenv: "{{ campus_lab_dir }}/.venv"

- name: Campus router + local building mini (bensserver)
  hosts: bensserver
  gather_facts: false

  tasks:
    - name: Detect LAN interface for secondary building IP
      ansible.builtin.shell: |
        ip -4 route get "{{ campus_ip }}" | awk '{for (i=1;i<=NF;i++) if ($i=="dev") {print $(i+1); exit}}'
      register: campus_iface_cmd
      changed_when: false

    - name: Set campus_iface fact
      ansible.builtin.set_fact:
        campus_iface: "{{ campus_iface_cmd.stdout | trim }}"

    - name: Add building secondary IP on bensserver
      ansible.builtin.command:
        argv:
          - ip
          - addr
          - add
          - "{{ building_local_ip }}/24"
          - dev
          - "{{ campus_iface }}"
      become: true
      register: add_building_ip
      failed_when: false
      changed_when: add_building_ip.rc == 0

    - name: Stop legacy lab processes
      ansible.builtin.command:
        argv: ["{{ campus_lab_dir }}/scripts/stop_lab.sh"]
      failed_when: false
      changed_when: false

    - name: Render full campus router JSON
      ansible.builtin.command:
        argv:
          - "{{ campus_lab_dir }}/scripts/render_campus_full_router_json.sh"
          - "{{ campus_lab_dir }}/config/campus-full-router.rendered.json"
      environment:
        HOST_IP: "{{ campus_ip }}"
        CAMPUS_IP: "{{ campus_ip }}"
        BUILDING_LOCAL_IP: "{{ building_local_ip }}"
        VAV_IP: "{{ vav_ip }}"
        AHU_IP: "{{ ahu_ip }}"

    - name: Install campus-router unit
      ansible.builtin.template:
        src: templates/campus-router.service.j2
        dest: /etc/systemd/system/campus-router.service
        mode: "0644"
      become: true
      notify: Restart campus router

    - name: Install campus-mini unit
      ansible.builtin.template:
        src: templates/campus-mini.service.j2
        dest: /etc/systemd/system/campus-mini.service
        mode: "0644"
      become: true
      notify: Restart campus mini

    - name: Enable and start campus-router
      ansible.builtin.systemd:
        name: campus-router
        enabled: true
        state: started
        daemon_reload: true
      become: true

    - name: Enable and start campus-mini
      ansible.builtin.systemd:
        name: campus-mini
        enabled: true
        state: started
        daemon_reload: true
      become: true

  handlers:
    - name: Restart campus router
      ansible.builtin.systemd:
        name: campus-router
        state: restarted
        daemon_reload: true
      become: true

    - name: Restart campus mini
      ansible.builtin.systemd:
        name: campus-mini
        state: restarted
        daemon_reload: true
      become: true

- name: Building VAV Pi
  hosts: building_vav
  gather_facts: false

  vars:
    bacnet_sample: fake_vav.py
    bacnet_device_name: "{{ vav_name }}"
    bacnet_instance: "{{ vav_instance }}"
    bacnet_network: "{{ net_vav }}"

  tasks:
    - name: Install campus-bacnet-device unit (VAV)
      ansible.builtin.template:
        src: templates/campus-bacnet-device.service.j2
        dest: /etc/systemd/system/campus-bacnet-device.service
        mode: "0644"
      become: true

    - name: Enable and start VAV device
      ansible.builtin.systemd:
        name: campus-bacnet-device
        enabled: true
        state: restarted
        daemon_reload: true
      become: true

- name: Building AHU Pi
  hosts: building_ahu
  gather_facts: false

  vars:
    bacnet_sample: fake_ahu.py
    bacnet_device_name: "{{ ahu_name }}"
    bacnet_instance: "{{ ahu_instance }}"
    bacnet_network: "{{ net_ahu }}"

  tasks:
    - name: Install campus-bacnet-device unit (AHU)
      ansible.builtin.template:
        src: templates/campus-bacnet-device.service.j2
        dest: /etc/systemd/system/campus-bacnet-device.service
        mode: "0644"
      become: true

    - name: Enable and start AHU device
      ansible.builtin.systemd:
        name: campus-bacnet-device
        enabled: true
        state: restarted
        daemon_reload: true
      become: true

- name: 60s BACnet capture (overwrite bacnet.pcap on each Pi)
  hosts: campus_lab
  gather_facts: false

  tasks:
    - name: Run campus_tcpdump_once.sh in background
      ansible.builtin.command:
        argv:
          - "{{ campus_lab_dir }}/scripts/campus_tcpdump_once.sh"
          - "{{ campus_capture_path }}"
          - "{{ campus_tcpdump_filter }}"
      async: 75
      poll: 0

- name: Verify campus lab
  hosts: campus_lab
  gather_facts: false

  tasks:
    - name: Wait for services
      ansible.builtin.pause:
        seconds: 5

    - name: Check bensserver units
      ansible.builtin.command:
        argv: ["systemctl", "is-active", "{{ item }}"]
      loop:
        - campus-router
        - campus-mini
      register: svc_boss
      changed_when: false
      failed_when: svc_boss.stdout != "active"
      become: true
      when: inventory_hostname == "bensserver"

    - name: Check building device unit
      ansible.builtin.command:
        argv: ["systemctl", "is-active", "campus-bacnet-device"]
      register: svc_bldg
      changed_when: false
      failed_when: svc_bldg.stdout != "active"
      become: true
      when: inventory_hostname != "bensserver"

    - name: Show listening BACnet UDP ports
      ansible.builtin.shell: ss -ulnp | grep -E '47808|47809' || true
      register: ss_bacnet
      changed_when: false

    - name: Print UDP sockets
      ansible.builtin.debug:
        msg: "{{ ss_bacnet.stdout_lines }}"
