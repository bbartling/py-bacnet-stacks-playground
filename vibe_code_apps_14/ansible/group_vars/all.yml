---
ansible_user: ben
ansible_ssh_pass: ben
ansible_become_pass: ben

campus_lab_dir: "/home/{{ ansible_user }}/vibe_code_apps_14"
campus_capture_path: "{{ campus_lab_dir }}/bacnet.pcap"
# All building + field-panel ports used in config/campus_buildings.yml
campus_tcpdump_filter: >-
  udp port 47809 or udp port 47810 or udp port 47811 or
  udp port 47819 or udp port 47820 or udp port 47821

campus_buildings_config: "{{ playbook_dir }}/../config/campus_buildings.yml"

campus_sync_excludes:
  - .venv
  - captures
  - run
  - .git
  - __pycache__
