name: vibe13-ci

permissions:
  contents: read

on:
  push:
    paths:
      - "vibe_code_apps_13/**"
      - ".github/workflows/vibe13-ci.yml"
  pull_request:
    paths:
      - "vibe_code_apps_13/**"
      - ".github/workflows/vibe13-ci.yml"

jobs:
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vibe_code_apps_13
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: test
        run: cargo test --workspace --locked
      - name: build release
        run: cargo build --release --workspace --locked
      - name: Phase 2 IP exclusion gate
        run: chmod +x scripts/check_mstp_no_ip.sh && ./scripts/check_mstp_no_ip.sh
      - name: MS/TP loopback acceptance
        run: cargo run --release --locked -p mstp-probe -- --profile smoke --report captures/mstp-loopback-ci.json loopback
      - name: cargo-deny (advisory/license)
        continue-on-error: true
        run: |
          cargo install cargo-deny --locked --version 0.18.2 || true
          cargo deny --manifest-path Cargo.toml check || true
      - name: cyclictest summary parser
        run: python3 scripts/test_cyclictest_summary.py
      - name: Streamlit console smoke (AppTest)
        run: |
          python3 -m venv .venv-ci
          .venv-ci/bin/pip install -r requirements-wire-dashboard.txt
          .venv-ci/bin/python scripts/test_streamlit_console.py
      - name: PTY soft smoke (100 rounds)
        run: |
          chmod +x scripts/run_pty_smoke.sh scripts/pty_null_modem.py
          ./scripts/run_pty_smoke.sh 100 captures/wire-test-pty-ci.json
      - name: Pi-lab inventory + wiring contract (offline)
        run: |
          python3 -m pip install --user PyYAML
          python3 ansible/pi-lab/tests/test_inventory_safety.py
          python3 ansible/pi-lab/tests/test_wiring_contract.py
      - name: shellcheck pi-lab scripts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck -x ansible/pi-lab/scripts/pi-lab
          shellcheck -x ansible/pi-lab/scripts/build_release.sh
      - name: Pi-lab ansible syntax (all playbooks, fixture inventory)
        working-directory: vibe_code_apps_13/ansible/pi-lab
        run: |
          python3 -m pip install --user 'ansible-core==2.17.9'
          export PATH="$HOME/.local/bin:$PATH"
          export ANSIBLE_CONFIG="$PWD/ansible.cfg"
          # ansible.cfg collections_path starts with .collections/
          ansible-galaxy collection install -r requirements.yml -p .collections
          # Never contact 192.168.204.0/24 — fixture uses 198.51.100.* only.
          for pb in playbooks/*.yml; do
            echo "syntax-check $pb"
            ansible-playbook --syntax-check -i files/fixtures/inventory.ci.yml "$pb"
          done
      - name: yamllint / ansible-lint (best-effort)
        working-directory: vibe_code_apps_13/ansible/pi-lab
        continue-on-error: true
        run: |
          python3 -m pip install --user 'yamllint==1.35.1' 'ansible-lint==24.10.0'
          yamllint -d '{extends: relaxed, rules: {line-length: disable}}' playbooks roles group_vars || true
          ansible-lint -p playbooks/*.yml || true
      - name: upload PTY report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vibe13-pty-smoke
          path: |
            vibe_code_apps_13/captures/wire-test-pty-ci.json
            vibe_code_apps_13/captures/mstp-loopback-ci.json
            vibe_code_apps_13/captures/phase2-no-ip-gate-status.txt
          if-no-files-found: ignore
