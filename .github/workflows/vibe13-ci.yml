name: vibe13-ci

permissions:
  contents: read

on:
  push:
    paths:
      - "vibe_code_apps_13/**"
      - ".github/workflows/vibe13-ci.yml"
  pull_request:
    paths:
      - "vibe_code_apps_13/**"
      - ".github/workflows/vibe13-ci.yml"

jobs:
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vibe_code_apps_13
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace
      - name: build release
        run: cargo build --release --workspace
      - name: Phase 2 IP exclusion gate
        run: chmod +x scripts/check_mstp_no_ip.sh && ./scripts/check_mstp_no_ip.sh
      - name: MS/TP loopback acceptance
        run: cargo run --release -p mstp-probe -- loopback --report captures/mstp-loopback-ci.json
      - name: Streamlit console smoke (AppTest)
        run: |
          python3 -m venv .venv-ci
          .venv-ci/bin/pip install -r requirements-wire-dashboard.txt
          .venv-ci/bin/python scripts/test_streamlit_console.py
      - name: PTY soft smoke (100 rounds)
        run: |
          chmod +x scripts/run_pty_smoke.sh scripts/pty_null_modem.py
          ./scripts/run_pty_smoke.sh 100 captures/wire-test-pty-ci.json
      - name: upload PTY report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vibe13-pty-smoke
          path: vibe_code_apps_13/captures/wire-test-pty-ci.json
          if-no-files-found: ignore
