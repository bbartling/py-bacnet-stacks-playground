# Build and publish vibe_code_apps_19 Docker image to GHCR.
# Image: ghcr.io/<owner>/vibe19
# Multi-arch: linux/amd64 (x86_64) + linux/arm64 (Raspberry Pi 4/5 64-bit).
name: vibe19-ghcr

on:
  workflow_dispatch:
    inputs:
      no_cache:
        description: "Rebuild without Buildx/GHA cache (use when GHCR tags point at missing blobs)"
        type: boolean
        default: false
  push:
    branches: [develop, main]
    tags: ["vibe19-v*"]
    paths:
      - "vibe_code_apps_19/**"
      - ".github/workflows/vibe19-ghcr.yml"
  pull_request:
    paths:
      - "vibe_code_apps_19/**"
      - ".github/workflows/vibe19-ghcr.yml"

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: vibe19

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            # Moving tips — default branch is develop, so :latest tracks tip of develop.
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=latest,enable=${{ github.ref_name == 'main' }}
            type=ref,event=branch
            type=sha,prefix=sha-
            type=match,pattern=vibe19-v(.*),group=1
            type=semver,pattern={{version}}
          labels: |
            org.opencontainers.image.title=vibe19
            org.opencontainers.image.description=Open FDD Vibe Coder Streamlit demo

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: vibe_code_apps_19
          file: vibe_code_apps_19/Dockerfile
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VIBE19_GIT_SHA=${{ github.sha }}
            VIBE19_IMAGE_REF=ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
            VIBE19_IMAGE_TAG=${{ github.ref_name }}
          # Cached builds can republish a multi-arch index that still cites deleted GHCR blobs.
          no-cache: ${{ github.event_name == 'workflow_dispatch' && inputs.no_cache == true }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Multi-platform manifests require push (or a registry); PRs build without push.
          provenance: false
