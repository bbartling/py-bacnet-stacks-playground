# Build and publish vibe_code_apps_19 Docker image to GHCR.
# Image: ghcr.io/<owner>/vibe19
name: vibe19-ghcr

on:
  workflow_dispatch:
  push:
    branches: [develop, main]
    tags: ["vibe19-v*"]
    paths:
      - "vibe_code_apps_19/**"
      - ".github/workflows/vibe19-ghcr.yml"
  pull_request:
    paths:
      - "vibe_code_apps_19/**"
      - ".github/workflows/vibe19-ghcr.yml"

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: vibe19

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha,prefix=sha-
            type=match,pattern=vibe19-v(.*),group=1
            type=semver,pattern={{version}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: vibe_code_apps_19
          file: vibe_code_apps_19/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
