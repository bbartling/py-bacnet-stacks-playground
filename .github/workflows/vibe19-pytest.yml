# RAM-light Vibe19 pytest on GitHub runners. Do not build Docker here.
name: vibe19-pytest

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "vibe_code_apps_19/**"
      - ".github/workflows/vibe19-pytest.yml"
  push:
    branches: [develop, main]
    paths:
      - "vibe_code_apps_19/**"
      - ".github/workflows/vibe19-pytest.yml"

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vibe_code_apps_19
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ".[dev,engineering-report]" -c constraints.txt
          python -c "import open_fdd,inspect; from open_fdd.catalog import rule_catalog_hash; from open_fdd.analytics.vav_health import SCHEMA_VERSION; print(open_fdd.__file__, open_fdd.__version__, rule_catalog_hash(), SCHEMA_VERSION)"
      - name: Runtime OpenFDD pin
        run: python -c "from app.openfdd_runtime import require_supported_open_fdd; print(require_supported_open_fdd())"
      - name: Focused contract tests
        run: |
          python -m pytest -q \
            tests/test_openfdd_runtime.py \
            tests/test_vav_health.py \
            tests/test_parent_ahu_map.py \
            tests/test_data_contract.py \
            tests/test_topology_enrich.py \
            tests/test_engineering_bundle_json.py \
            tests/test_wattlab_export_profiles.py \
            tests/test_wattlab_performance_contract.py \
            tests/test_wattlab_dump.py \
            tests/test_wattlab_dump_complete.py \
            tests/test_analytics_shim_parity.py \
            tests/test_calibration_readiness.py \
            tests/test_cookbook_rules.py \
            tests/test_fdd_runtime.py \
            tests/test_building100_baseline.py
      - name: Package security and session isolation
        run: |
          python -m pytest -q -m "not optional_zip" \
            tests/test_package_security.py \
            tests/test_package_io.py \
            tests/test_session_workspace.py \
            tests/test_multi_zip.py \
            tests/test_sidecar_maps.py
