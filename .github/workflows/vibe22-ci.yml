name: vibe22-ci
on:
  push:
    branches: [develop, main]
    paths:
      - "vibe_code_apps_22/**"
      - ".github/workflows/vibe22-ci.yml"
  pull_request:
    branches: [develop, main]
    paths:
      - "vibe_code_apps_22/**"
      - ".github/workflows/vibe22-ci.yml"
  workflow_dispatch:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vibe_code_apps_22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt pytest
      - name: Pytest (full vibe22 suite)
        run: python -m pytest tests -q --tb=short

  # desktop-rust removed: hybrid ONNX egui app archived under
  # vibe_code_apps_22/archive/2026-08-10_pre_eplus_gym/desktop_onnx/
