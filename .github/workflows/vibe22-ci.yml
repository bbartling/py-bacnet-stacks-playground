name: vibe22-ci
on:
  push:
    branches: [develop, main]
    paths:
      - "vibe_code_apps_22/**"
      - ".github/workflows/vibe22-ci.yml"
  pull_request:
    branches: [develop, main]
    paths:
      - "vibe_code_apps_22/**"
      - ".github/workflows/vibe22-ci.yml"
  workflow_dispatch:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vibe_code_apps_22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install -U pip
          pip install pytest pandas numpy pyarrow joblib scikit-learn matplotlib
      - name: Pytest (full vibe22 suite)
        run: python -m pytest tests -q --tb=short

  desktop-rust:
    # Linux runners are far more available than windows-latest; ort/eframe compile fine here.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vibe_code_apps_22/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: System deps (egui / winit)
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libssl-dev pkg-config libgtk-3-dev
      - name: Cargo test
        run: cargo test --quiet
