name: vibe22-ci
on:
  push:
    branches: [develop, main]
    paths:
      - "vibe_code_apps_22/**"
      - "third_party/rllib-energyplus/**"
      - ".github/workflows/vibe22-ci.yml"
  pull_request:
    branches: [develop, main]
    paths:
      - "vibe_code_apps_22/**"
      - "third_party/rllib-energyplus/**"
      - ".github/workflows/vibe22-ci.yml"
  workflow_dispatch:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vibe_code_apps_22
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt pytest
      - name: Pytest (RL-only vibe22 suite)
        run: python -m pytest tests -q --tb=short
