name: vibe12 unit tests

on:
  push:
    paths:
      - "vibe_code_apps_12/**"
      - ".github/workflows/vibe12-tests.yml"
  pull_request:
    paths:
      - "vibe_code_apps_12/**"
      - ".github/workflows/vibe12-tests.yml"

jobs:
  python-unittest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    defaults:
      run:
        working-directory: vibe_code_apps_12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install edge + web deps
        run: pip install -r requirements.txt -r aws_cloud_pipeline/web_lambda/requirements.txt
      - name: Run unittest
        run: python3 -m unittest discover -s tests -v

  vibe12-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vibe_code_apps_12/apps/vibe12-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: vibe_code_apps_12/apps/vibe12-web/package-lock.json
      - name: Install and test
        run: |
          npm ci
          npm test
      - name: Production build
        run: npm run build
