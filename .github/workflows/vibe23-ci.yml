name: vibe23-ci
on:
  push:
    branches: [develop, main]
    paths:
      - "vibe_code_apps_23/**"
      - "agentic_ai/**"
      - ".github/workflows/vibe23-ci.yml"
  pull_request:
    branches: [develop, main]
    paths:
      - "vibe_code_apps_23/**"
      - "agentic_ai/**"
      - ".github/workflows/vibe23-ci.yml"
  workflow_dispatch:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vibe_code_apps_23
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Vibe 23
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
      - name: Pytest
        run: python -m pytest
