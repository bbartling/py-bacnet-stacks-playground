name: vibe23-ci
on:
  push:
    branches: [develop, main]
    paths:
      - "vibe_code_apps_23/**"
      - "agentic_ai/**"
      - ".github/workflows/vibe23-ci.yml"
  pull_request:
    branches: [develop, main]
    paths:
      - "vibe_code_apps_23/**"
      - "agentic_ai/**"
      - ".github/workflows/vibe23-ci.yml"
  workflow_dispatch:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: vibe_code_apps_23
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Vibe 23
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
      - name: Pytest
        run: python -m pytest
      - name: Ruff
        run: python -m ruff check src tests
      - name: Compile package
        run: python -m compileall -q src/vibe23
      - name: Validate Vibe 19-22 shared-skill migration
        working-directory: .
        run: python agentic_ai/skills/scripts/validate_registry.py
